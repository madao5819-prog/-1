<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2b1a0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ビールよけ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>ビールよけ</title>
<style>
  :root {
    --bg: #2b1a0e;
    --panel: #fff7e6;
    --ink: #3a2410;
    --accent: #f2a516;
    --accent-dark: #a86e07;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  #app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: env(safe-area-inset-top);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }
  #field {
    flex: 1;
    width: 100%;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas { display: block; }

  #controls {
    touch-action: none;
    width: 100%;
    max-width: 520px;
    display: flex;
    gap: 12px;
    padding: 6px 12px calc(8px + env(safe-area-inset-bottom));
  }
  .pad {
    flex: 1;
    height: 60px;
    border: none;
    border-radius: 16px;
    background: #4a2f19;
    color: var(--accent);
    font-size: 26px;
    box-shadow: 0 4px 0 #1a0f07;
    pointer-events: none;
  }
  .pad.on {
    background: var(--accent);
    color: var(--bg);
    transform: translateY(4px);
    box-shadow: 0 2px 0 #1a0f07;
  }

  #pauseBtn {
    position: absolute;
    top: calc(10px + env(safe-area-inset-top));
    right: calc(10px + env(safe-area-inset-right));
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    background: rgba(58,36,16,.75);
    color: var(--panel);
    font-size: 18px;
    font-weight: bold;
    display: none;
  }
  #pauseBtn.show { display: block; }

  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
    text-align: center;
    background: rgba(43, 26, 14, .82);
    color: var(--panel);
    z-index: 10;
  }
  .overlay.hidden { display: none; }
  /* 画面が低いスマホでは中身をスクロールできるようにする */
  .overlay { overflow-y: auto; touch-action: pan-y; }
  .overlay > :first-child { margin-top: auto; }
  .overlay > :last-child { margin-bottom: auto; }
  .overlay a.buy {
    display: inline-block;
    margin-top: 10px;
    padding: 10px 26px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--ink);
    font-weight: bold;
    text-decoration: none;
  }
  .faceTools { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .faceTools button { min-width: 0 !important; margin-top: 0 !important; }
  #cropScreen, #lockScreen { background: var(--bg); z-index: 25; }
  /* クリア画面：紙吹雪がひらひら舞う */
  #clearScreen {
    z-index: 26;
    background: radial-gradient(circle at 50% 35%, #5a3a12 0%, #2b1a0e 70%);
  }
  #clearScreen > * { margin-top: 0; margin-bottom: 0; position: relative; z-index: 1; }
  #clearScreen > #confetti { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  #clearScreen .congrats { font-size: clamp(28px, 9vw, 44px); white-space: nowrap; color: #ffd34d; animation: pop 1.2s ease-in-out infinite alternate; }
  #clearScreen .clearLead { font-size: 20px; }
  #clearScreen .face { border-color: #ffd34d; box-shadow: 0 0 30px rgba(255,211,77,.6); }
  @keyframes pop { from { transform: scale(1); } to { transform: scale(1.08); } }
  #cropCanvas { border-radius: 50%; border: 5px solid var(--accent); touch-action: none; background: #222; }
  #cropZoom { width: 230px; accent-color: var(--accent); }
  .overlay input[type=text] {
    font: inherit;
    font-size: 20px;
    width: 240px;
    padding: 12px 16px;
    border-radius: 14px;
    border: 3px solid var(--accent);
    text-align: center;
    background: var(--panel);
    color: var(--ink);
  }
  .overlay h1 {
    margin: 0;
    font-size: 42px;
    letter-spacing: .05em;
    color: var(--accent);
    text-shadow: 0 3px 0 #7a4a06;
  }
  .overlay p { margin: 0; line-height: 1.7; font-size: 16px; }
  .overlay .face {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    border: 5px solid var(--accent);
    object-fit: cover;
  }
  .overlay button {
    margin-top: 6px;
    min-width: 220px;
    font: inherit;
    font-size: 22px;
    font-weight: bold;
    padding: 16px 36px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: var(--ink);
    box-shadow: 0 6px 0 var(--accent-dark);
  }
  .overlay button:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--accent-dark); }
  .overlay button.sub {
    background: transparent;
    color: var(--panel);
    box-shadow: none;
    border: 2px solid rgba(255,247,230,.5);
    font-size: 16px;
    padding: 10px 24px;
  }
  .small { font-size: 13px !important; opacity: .8; }
  .best { color: var(--accent); font-weight: bold; }

  #rotate { display: none; }
  @media (orientation: landscape) and (max-height: 500px) {
    #rotate { display: flex; z-index: 20; background: var(--bg); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="field"><canvas id="game"></canvas></div>
  <div id="controls">
    <button class="pad" id="leftBtn" aria-label="左へ">◀</button>
    <button class="pad" id="rightBtn" aria-label="右へ">▶</button>
  </div>
  <button id="pauseBtn" aria-label="一時停止">II</button>
</div>

<div class="overlay" id="startScreen">
  <img class="face" src="oyaji.png" alt="">
  <h1>ビールよけ</h1>
  <p>あいつがビールをかけてくる！<br>よけるほどレベルアップ<br>1杯でも浴びたらゲームオーバー</p>
  <p class="small">⚠ 赤いエリアは「範囲攻撃」。すぐ逃げろ！</p>
  <p class="small">◀ ▶ ボタンを押す or 画面をなぞって動かす</p>
  <p class="best" id="bestText"></p>
  <button id="startBtn">スタート</button>
</div>

<div class="overlay hidden" id="pauseScreen">
  <h1>ひと休み</h1>
  <p>ビールは待ってくれている…</p>
  <button id="resumeBtn">つづける</button>
  <button class="sub" id="quitBtn">タイトルへ</button>
</div>

<div class="overlay hidden" id="endScreen">
  <img class="face" src="oyaji.png" alt="">
  <h1 id="endTitle"></h1>
  <p id="endText"></p>
  <button id="retryBtn">もう一回</button>
  <button class="sub" id="titleBtn">タイトルへ</button>
</div>

<div class="overlay hidden" id="clearScreen">
  <canvas id="confetti"></canvas>
  <img class="face" src="oyaji.png" alt="">
  <h1 class="congrats">🎉 おめでとう！ 🎉</h1>
  <p class="clearLead">素戔嗚尊を超えて<br><b>全制覇</b>しました！</p>
  <p id="clearText"></p>
  <button id="continueBtn">無限の宴へ（続ける）</button>
  <button class="sub" id="clearTitleBtn">タイトルへ</button>
</div>

<div class="overlay" id="rotate">
  <h1>📱</h1>
  <p>スマホを縦にして遊んでね</p>
</div>

<div class="overlay" id="lockScreen" style="z-index:30">
  <img class="face" src="oyaji.png" alt="">
  <h1>ビールよけ</h1>
  <p>購入ページに書いてある<br>合言葉を入れてください</p>
  <input id="passInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="合言葉">
  <button id="unlockBtn">はじめる</button>
  <p class="small" id="passErr"></p>
</div>

    if (!await unlock(input.value, true)) err.textContent = '合言葉がちがいます';
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('unlockBtn').click(); });

  // 一度入れた合言葉は覚えておく
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (_) {}
  if (saved) unlock(saved, false);
})();
</script>
</body>
</html>
