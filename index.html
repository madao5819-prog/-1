<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noimageindex">
<meta name="theme-color" content="#2b1a0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ビールよけ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>ビールよけ</title>
<style>
  :root {
    --bg: #2b1a0e;
    --panel: #fff7e6;
    --ink: #3a2410;
    --accent: #f2a516;
    --accent-dark: #a86e07;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  #app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: env(safe-area-inset-top);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }
  #field {
    flex: 1;
    width: 100%;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas { display: block; }

  #controls {
    width: 100%;
    max-width: 520px;
    display: flex;
    gap: 12px;
    padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
  }
  .pad {
    flex: 1;
    height: 84px;
    border: none;
    border-radius: 20px;
    background: #4a2f19;
    color: var(--accent);
    font-size: 36px;
    box-shadow: 0 6px 0 #1a0f07;
    touch-action: none;
  }
  .pad.on {
    background: var(--accent);
    color: var(--bg);
    transform: translateY(4px);
    box-shadow: 0 2px 0 #1a0f07;
  }

  #pauseBtn {
    position: absolute;
    top: calc(10px + env(safe-area-inset-top));
    right: calc(10px + env(safe-area-inset-right));
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    background: rgba(58,36,16,.75);
    color: var(--panel);
    font-size: 18px;
    font-weight: bold;
    display: none;
  }
  #pauseBtn.show { display: block; }

  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
    text-align: center;
    background: rgba(43, 26, 14, .82);
    color: var(--panel);
    z-index: 10;
  }
  .overlay.hidden { display: none; }
  .overlay h1 {
    margin: 0;
    font-size: 42px;
    letter-spacing: .05em;
    color: var(--accent);
    text-shadow: 0 3px 0 #7a4a06;
  }
  .overlay p { margin: 0; line-height: 1.7; font-size: 16px; }
  .overlay .face {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    border: 5px solid var(--accent);
    object-fit: cover;
  }
  .overlay button {
    margin-top: 6px;
    min-width: 220px;
    font: inherit;
    font-size: 22px;
    font-weight: bold;
    padding: 16px 36px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: var(--ink);
    box-shadow: 0 6px 0 var(--accent-dark);
  }
  .overlay button:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--accent-dark); }
  .overlay button.sub {
    background: transparent;
    color: var(--panel);
    box-shadow: none;
    border: 2px solid rgba(255,247,230,.5);
    font-size: 16px;
    padding: 10px 24px;
  }
  .small { font-size: 13px !important; opacity: .8; }
  .best { color: var(--accent); font-weight: bold; }

  #rotate { display: none; }
  @media (orientation: landscape) and (max-height: 500px) {
    #rotate { display: flex; z-index: 20; background: var(--bg); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="field"><canvas id="game"></canvas></div>
  <div id="controls">
    <button class="pad" id="leftBtn" aria-label="左へ">◀</button>
    <button class="pad" id="rightBtn" aria-label="右へ">▶</button>
  </div>
  <button id="pauseBtn" aria-label="一時停止">II</button>
</div>

<div class="overlay" id="startScreen">
  <img class="face" src="face.jpg" alt="">
  <h1>ビールよけ</h1>
  <p>あいつがビールをかけてくる！<br>10杯よけるごとにレベルアップ<br>1杯でも浴びたらゲームオーバー</p>
  <p class="small">⚠ 赤いエリアは「範囲攻撃」。すぐ逃げろ！</p>
  <p class="small">◀ ▶ ボタンを押す or 画面をなぞって動かす</p>
  <p class="best" id="bestText"></p>
  <button id="startBtn">スタート</button>
</div>

<div class="overlay hidden" id="pauseScreen">
  <h1>ひと休み</h1>
  <p>ビールは待ってくれている…</p>
  <button id="resumeBtn">つづける</button>
  <button class="sub" id="quitBtn">タイトルへ</button>
</div>

<div class="overlay hidden" id="endScreen">
  <img class="face" src="face.jpg" alt="">
  <h1 id="endTitle"></h1>
  <p id="endText"></p>
  <button id="retryBtn">もう一回</button>
  <button class="sub" id="titleBtn">タイトルへ</button>
</div>

<div class="overlay" id="rotate">
  <h1>📱</h1>
  <p>スマホを縦にして遊んでね</p>
</div>

<script>
(() => {
  const W = 400;
  let H = 640;
  const PER_LEVEL = 10;
  const LEVEL_NAMES = ['ほろ酔い', '一杯目', 'ほろほろ', '二次会', 'ハシゴ酒', '泥酔', '記憶なし', '地獄の飲み会', 'クソゲー'];
  const levelName = L => L <= LEVEL_NAMES.length ? LEVEL_NAMES[L - 1] : 'クソゲー極';

  const $ = id => document.getElementById(id);
  const canvas = $('game');
  const ctx = canvas.getContext('2d');
  const field = $('field');
  const startScreen = $('startScreen');
  const pauseScreen = $('pauseScreen');
  const endScreen = $('endScreen');
  const pauseBtn = $('pauseBtn');

  const faceImg = new Image();
  faceImg.src = 'face.jpg';

  // ---------- 記録 ----------
  const BEST_KEY = 'beer-dodge-best';
  function loadBest() {
    try {
      const b = JSON.parse(localStorage.getItem(BEST_KEY)) || {};
      return { score: b.score || b.dodged || 0, level: b.level || 1 };
    } catch (_) { return { score: 0, level: 1 }; }
  }
  function saveBest(b) {
    try { localStorage.setItem(BEST_KEY, JSON.stringify(b)); } catch (_) {}
  }
  let best = loadBest();
  function showBest() {
    $('bestText').textContent = best.score > 0
      ? `ベスト：${best.score}杯（Lv.${best.level} ${levelName(best.level)}）`
      : '';
  }
  showBest();

  // ---------- 難易度 ----------
  // レベルが上がるほど速く・多く・容赦なくなる。Lv.9 以降はクソゲー。
  function params(L, inLevel) {
    return {
      speed: Math.min(980, 240 + L * 55 + inLevel * 4),
      interval: Math.max(0.16, 1.3 - L * 0.13),
      fan: L >= 9 ? 5
         : L >= 7 ? (Math.random() < 0.5 ? 3 : 5)
         : L >= 5 ? 3
         : L >= 3 ? (Math.random() < 0.5 ? 1 : 2)
         : 1,
      lead: Math.min(0.9, 0.12 * (L - 1)),
      bossSpeed: 70 + L * 20,
      areaInterval: Math.max(1.5, 7.5 - L * 0.65),
      warn: Math.max(0.42, 1.15 - L * 0.08),
      playerSpeed: 300 + Math.min(L, 10) * 8,
      sway: L >= 7 ? Math.min(0.05, (L - 6) * 0.012) : 0,
    };
  }

  // ---------- 画面サイズ（縦長スマホは画面いっぱいに） ----------
  let scale = 1;
  function resize() {
    const r = field.getBoundingClientRect();
    scale = Math.min(r.width / W, r.height / 560);
    H = Math.round(Math.min(900, Math.max(560, r.height / scale)));
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.style.width = (W * scale) + 'px';
    canvas.style.height = (H * scale) + 'px';
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    if (player) player.y = H - 70;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));

  // iOS のピンチズーム・ダブルタップズームを防ぐ
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());
  document.addEventListener('contextmenu', e => e.preventDefault());

  // ---------- 音と振動 ----------
  let audio = null;
  function beep(freq, dur, type = 'square', vol = 0.06, slide = 0) {
    if (!audio) return;
    const t = audio.currentTime;
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audio.destination);
    o.start(t);
    o.stop(t + dur);
  }
  function vibrate(p) {
    try { if (navigator.vibrate) navigator.vibrate(p); } catch (_) {}
  }
  const sfx = {
    throw: () => beep(500, 0.15, 'triangle', 0.06, -250),
    dodge: () => { beep(880, 0.06, 'square', 0.03); vibrate(10); },
    warn: () => { beep(330, 0.12, 'square', 0.05); setTimeout(() => beep(330, 0.12, 'square', 0.05), 160); },
    pour: () => beep(160, 0.45, 'sawtooth', 0.05, -80),
    area: () => { beep(1046, 0.1, 'square', 0.04); vibrate(25); },
    splash: () => { beep(200, 0.5, 'sawtooth', 0.08, -150); beep(120, 0.6, 'square', 0.05, -60); vibrate([120, 60, 220]); },
    levelUp: () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.16, 'square', 0.05), i * 100)); vibrate([30, 30, 30, 30, 80]); },
  };
  function unlockAudio() {
    if (!audio) {
      try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { audio = null; }
    }
    if (audio && audio.state === 'suspended') audio.resume();
  }

  // ---------- 入力 ----------
  const keys = { left: false, right: false };
  const pads = { left: false, right: false };
  let pointerX = null;

  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
    if (e.key === 'Escape' || e.key === 'p') togglePause();
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
  });

  function bindPad(el, side) {
    const on = e => { e.preventDefault(); pads[side] = true; el.classList.add('on'); el.setPointerCapture?.(e.pointerId); };
    const off = () => { pads[side] = false; el.classList.remove('on'); };
    el.addEventListener('pointerdown', on);
    el.addEventListener('pointerup', off);
    el.addEventListener('pointercancel', off);
    el.addEventListener('lostpointercapture', off);
  }
  bindPad($('leftBtn'), 'left');
  bindPad($('rightBtn'), 'right');

  // 画面をなぞると指の位置へ動く
  function toGameX(clientX) {
    const r = canvas.getBoundingClientRect();
    return (clientX - r.left) / scale;
  }
  canvas.addEventListener('pointerdown', e => { pointerX = toGameX(e.clientX); canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e => { if (pointerX !== null) pointerX = toGameX(e.clientX); });
  const releasePointer = () => { pointerX = null; };
  canvas.addEventListener('pointerup', releasePointer);
  canvas.addEventListener('pointercancel', releasePointer);

  function inputDir() {
    if (pointerX !== null) {
      const diff = pointerX - player.x;
      return Math.abs(diff) < 6 ? 0 : Math.sign(diff);
    }
    return ((keys.right || pads.right) ? 1 : 0) - ((keys.left || pads.left) ? 1 : 0);
  }

  // ---------- ゲーム状態 ----------
  let state = 'title';
  let paused = false;
  let player, bosses, beers, areas, particles, popups;
  let dodged, level, throwTimer, areaTimer, levelPause, banner, shake, time, endTimer, deathBy, nextBoss;

  function makeBoss(x, dir) {
    return { x, y: 92, r: 58, dir, windup: 0 };
  }

  function reset() {
    player = { x: W / 2, y: H - 70, w: 34, h: 56, face: 1, step: 0, hurt: false };
    bosses = [makeBoss(W / 2, 1)];
    beers = [];
    areas = [];
    particles = [];
    popups = [];
    dodged = 0;
    level = 1;
    throwTimer = 1.2;
    areaTimer = 0;
    levelPause = 0;
    banner = null;
    shake = 0;
    time = 0;
    endTimer = 0;
    deathBy = '';
    nextBoss = 0;
  }

  function start() {
    unlockAudio();
    reset();
    state = 'play';
    paused = false;
    startScreen.classList.add('hidden');
    endScreen.classList.add('hidden');
    pauseScreen.classList.add('hidden');
    pauseBtn.classList.add('show');
    banner = { title: 'Lv.1', sub: levelName(1), life: 1.4 };
  }

  function toTitle() {
    reset();
    state = 'title';
    paused = false;
    showBest();
    pauseScreen.classList.add('hidden');
    endScreen.classList.add('hidden');
    startScreen.classList.remove('hidden');
    pauseBtn.classList.remove('show');
  }

  function setPaused(p) {
    if (state !== 'play') return;
    paused = p;
    pauseScreen.classList.toggle('hidden', !p);
    if (!p) unlockAudio();
  }
  function togglePause() { setPaused(!paused); }

  $('startBtn').addEventListener('click', start);
  $('retryBtn').addEventListener('click', start);
  $('titleBtn').addEventListener('click', toTitle);
  $('quitBtn').addEventListener('click', toTitle);
  $('resumeBtn').addEventListener('click', () => setPaused(false));
  pauseBtn.addEventListener('click', () => setPaused(true));
  // アプリを切り替えたら自動で一時停止
  document.addEventListener('visibilitychange', () => { if (document.hidden) setPaused(true); });

  // ---------- スコア・レベル ----------
  function addDodge(text, x, y) {
    dodged++;
    popups.push({ x, y, text, life: 0.7 });
    const newLevel = Math.floor(dodged / PER_LEVEL) + 1;
    if (newLevel > level) levelUp(newLevel);
  }

  function levelUp(L) {
    level = L;
    levelPause = 1.4;
    throwTimer = Math.max(throwTimer, 1.4);
    areaTimer = Math.max(areaTimer, 2.2);
    banner = { title: `LEVEL UP!  Lv.${L}`, sub: levelName(L), life: 1.8 };
    sfx.levelUp();
    // Lv.6 からビールをかけてくる人が2人になる
    if (L >= 6 && bosses.length < 2) {
      const b = bosses[0];
      bosses.push(makeBoss(b.x > W / 2 ? 80 : W - 80, -b.dir));
      popups.push({ x: W / 2, y: 230, text: 'もう1人きた！', life: 1.6, color: '#d9412b' });
    }
  }

  // ---------- 通常攻撃：ビールを投げる ----------
  function throwVolley(p) {
    const boss = bosses[nextBoss % bosses.length];
    nextBoss++;
    const sx = boss.x + (Math.random() - 0.5) * 30;
    const sy = boss.y + 40;
    let tx = player.x + (Math.random() - 0.5) * 50;
    if (Math.random() < p.lead) {
      const dist = Math.hypot(tx - sx, player.y - sy);
      tx += inputDir() * p.playerSpeed * (dist / p.speed) * 0.7;
    }
    tx = Math.max(20, Math.min(W - 20, tx));
    const base = Math.atan2(player.y - sy, tx - sx);
    const spread = 0.21;
    for (let k = 0; k < p.fan; k++) {
      const a = base + (k - (p.fan - 1) / 2) * spread;
      beers.push({
        x: sx, y: sy,
        vx: Math.cos(a) * p.speed,
        vy: Math.sin(a) * p.speed,
        rot: 0,
        spin: (Math.random() < 0.5 ? -1 : 1) * (4 + Math.random() * 4),
      });
    }
    boss.windup = 0.25;
    sfx.throw();
  }

  // ---------- 範囲攻撃 ----------
  // pour: プレイヤー付近に太いビールの滝。gap: 安全地帯以外ぜんぶビール。
  function startArea(p) {
    const ps = p.playerSpeed;
    const types = ['pour'];
    if (level >= 4) types.push('double');
    if (level >= 5) types.push('gap', 'gap');
    const type = types[Math.floor(Math.random() * types.length)];
    let rects = [];
    let safe = null;

    if (type === 'pour' || type === 'double') {
      const n = type === 'double' ? 2 : 1;
      for (let i = 0; i < n; i++) {
        const w = 110 + Math.random() * Math.min(90, level * 12);
        const c = i === 0
          ? player.x + (Math.random() - 0.5) * 60
          : Math.random() * W;
        const x1 = Math.max(0, Math.min(W - w, c - w / 2));
        rects.push([x1, x1 + w]);
      }
    } else {
      const gw = Math.max(70, 120 - level * 5);
      // 安全地帯は必ず間に合う距離に置く
      const reach = ps * p.warn * 0.8;
      let c = player.x + (Math.random() * 2 - 1) * reach;
      c = Math.max(gw / 2 + 4, Math.min(W - gw / 2 - 4, c));
      safe = [c - gw / 2, c + gw / 2];
      rects = [[0, safe[0]], [safe[1], W]];
    }
    areas.push({ rects, safe, t: 0, warn: p.warn, active: 0.65, poured: false });
    sfx.warn();
  }

  function inArea(a) {
    // 少しだけ甘めの判定
    const m = 8;
    return a.rects.some(([x1, x2]) => player.x > x1 + m && player.x < x2 - m);
  }

  function addSplash(x, y, n, big) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2;
      const s = (big ? 120 : 40) + Math.random() * (big ? 260 : 80);
      particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s - (big ? 120 : 20),
        life: 0.6 + Math.random() * 0.6,
        max: 1.2,
        r: 2 + Math.random() * (big ? 6 : 3),
        foam: Math.random() < 0.35,
      });
    }
  }

  function rectHit(b) {
    // 当たり判定は見た目より少し小さめ
    const bw = 18, bh = 24;
    const pw = player.w * 0.7, ph = player.h * 0.85;
    return Math.abs(b.x - player.x) < (bw + pw) / 2 &&
           Math.abs(b.y - (player.y - 4)) < (bh + ph) / 2;
  }

  // ---------- 更新 ----------
  function update(dt) {
    time += dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 30);

    for (const p of particles) {
      p.vy += 600 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
    }
    if (particles.length > 500) particles.splice(0, particles.length - 500);
    particles = particles.filter(p => p.life > 0);
    for (const p of popups) { p.y -= 40 * dt; p.life -= dt; }
    popups = popups.filter(p => p.life > 0);
    if (banner) { banner.life -= dt; if (banner.life <= 0) banner = null; }

    if (state === 'over') {
      endTimer += dt;
      for (const a of areas) a.t += dt;
      return;
    }
    if (state !== 'play') return;

    const p = params(level, dodged % PER_LEVEL);

    // プレイヤー
    const move = inputDir();
    player.x += move * p.playerSpeed * dt;
    player.x = Math.max(player.w / 2 + 4, Math.min(W - player.w / 2 - 4, player.x));
    if (move !== 0) { player.face = move; player.step += dt * 14; }

    // ビールをかけてくる人
    for (const b of bosses) {
      b.x += b.dir * p.bossSpeed * dt;
      if (b.x > W - b.r - 10) { b.x = W - b.r - 10; b.dir = -1; }
      if (b.x < b.r + 10) { b.x = b.r + 10; b.dir = 1; }
      if (b.windup > 0) b.windup -= dt;
    }

    if (levelPause > 0) levelPause -= dt;

    // 通常攻撃
    throwTimer -= dt;
    if (throwTimer <= 0 && levelPause <= 0) {
      throwVolley(p);
      throwTimer = p.interval * (bosses.length > 1 ? 0.75 : 1) + Math.random() * 0.3;
    }

    // 範囲攻撃（Lv.2 から）
    if (level >= 2 && levelPause <= 0) {
      areaTimer -= dt;
      const busy = areas.length >= (level >= 8 ? 2 : 1);
      if (areaTimer <= 0 && !busy) {
        startArea(p);
        areaTimer = p.areaInterval + Math.random() * 1.5;
      }
    }

    for (const a of areas) {
      a.t += dt;
      if (a.t >= a.warn) {
        if (!a.poured) { a.poured = true; sfx.pour(); shake = Math.max(shake, 4); }
        if (inArea(a)) {
          deathBy = 'ビールの滝に飲まれた…';
          gameOver();
          return;
        }
        if (Math.random() < 0.6) {
          const [x1, x2] = a.rects[Math.floor(Math.random() * a.rects.length)];
          addSplash(x1 + Math.random() * (x2 - x1), H - 30, 2, false);
        }
      }
      if (a.t >= a.warn + a.active) {
        a.done = true;
        sfx.area();
        addDodge('範囲よけた！', player.x, player.y - 70);
      }
    }
    areas = areas.filter(a => !a.done);

    // ビール
    for (const b of beers) {
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.rot += b.spin * dt;
      if (Math.random() < 0.4) {
        particles.push({ x: b.x, y: b.y, vx: (Math.random() - 0.5) * 30, vy: -20, life: 0.4, max: 0.4, r: 2 + Math.random() * 2, foam: Math.random() < 0.5 });
      }
      if (rectHit(b)) {
        deathBy = 'ビールを頭からかぶった…';
        gameOver();
        return;
      }
      const passed = b.y > player.y + player.h / 2 + 10;
      const out = b.x < -30 || b.x > W + 30;
      if (passed || out) {
        b.gone = true;
        sfx.dodge();
        if (passed) addSplash(b.x, H - 14, 8, false);
        addDodge('よけた！', player.x, player.y - 50);
        if (state !== 'play') return;
      }
    }
    beers = beers.filter(b => !b.gone);
  }

  function gameOver() {
    state = 'over';
    pauseBtn.classList.remove('show');
    pads.left = pads.right = false;
    pointerX = null;
    document.querySelectorAll('.pad').forEach(el => el.classList.remove('on'));
    player.hurt = true;
    shake = 14;
    addSplash(player.x, player.y - 20, 90, true);
    sfx.splash();
    const newBest = dodged > best.score;
    if (newBest) { best = { score: dodged, level }; saveBest(best); }
    setTimeout(() => {
      $('endTitle').textContent = 'ビールまみれ…';
      $('endText').innerHTML =
        `${deathBy}<br>` +
        `よけた数：<b>${dodged}</b> 杯${newBest ? '（自己ベスト！）' : ''}<br>` +
        `到達：<b>Lv.${level} ${levelName(level)}</b><br>` +
        `<span class="small">ベスト：${best.score}杯（Lv.${best.level}）</span>`;
      endScreen.classList.remove('hidden');
    }, 1100);
  }

  // ---------- 描画 ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function outlinedText(text, x, y, size, fill, align = 'center') {
    ctx.font = `bold ${size}px sans-serif`;
    ctx.textAlign = align;
    ctx.lineWidth = 5;
    ctx.strokeStyle = '#fff';
    ctx.strokeText(text, x, y);
    ctx.fillStyle = fill;
    ctx.fillText(text, x, y);
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    // レベルが上がると店内がだんだん赤く（酔って）くる
    const heat = Math.min(1, (level - 1) / 8);
    g.addColorStop(0, `rgb(${243}, ${Math.round(223 - heat * 60)}, ${Math.round(182 - heat * 90)})`);
    g.addColorStop(1, `rgb(${230}, ${Math.round(196 - heat * 70)}, ${Math.round(140 - heat * 80)})`);
    ctx.fillStyle = g;
    ctx.fillRect(-40, -40, W + 80, H + 80);

    for (let i = 0; i < 4; i++) {
      const x = 50 + i * 100;
      const sway = Math.sin(time * 1.5 + i) * 3;
      ctx.save();
      ctx.translate(x + sway, 20);
      ctx.fillStyle = '#d9412b';
      ctx.beginPath();
      ctx.ellipse(0, 0, 13, 17, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,220,150,.35)';
      ctx.beginPath();
      ctx.ellipse(-4, -4, 4, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#3a2410';
      ctx.fillRect(-7, -19, 14, 4);
      ctx.fillRect(-7, 15, 14, 4);
      ctx.restore();
    }

    ctx.fillStyle = '#b07a3f';
    ctx.fillRect(-40, H - 30, W + 80, 70);
    ctx.fillStyle = '#8c5a28';
    for (let x = 0; x < W; x += 50) ctx.fillRect(x, H - 30, 2, 30);
    ctx.fillStyle = '#c99257';
    ctx.fillRect(-40, H - 30, W + 80, 4);
  }

  function drawAreas() {
    const top = 218;
    for (const a of areas) {
      if (a.t < a.warn) {
        // 予告：赤く点滅するエリア
        const blink = 0.18 + 0.17 * (0.5 + 0.5 * Math.sin(a.t * 30));
        for (const [x1, x2] of a.rects) {
          ctx.fillStyle = `rgba(217,65,43,${blink})`;
          ctx.fillRect(x1, top, x2 - x1, H - 30 - top);
          ctx.save();
          ctx.beginPath();
          ctx.rect(x1, top, x2 - x1, H - 30 - top);
          ctx.clip();
          ctx.strokeStyle = 'rgba(217,65,43,.35)';
          ctx.lineWidth = 8;
          const off = (a.t * 80) % 32;
          for (let s = -H; s < W + H; s += 32) {
            ctx.beginPath();
            ctx.moveTo(s + off, top);
            ctx.lineTo(s + off - (H - top), H);
            ctx.stroke();
          }
          ctx.restore();
          if (x2 - x1 > 40) outlinedText("⚠", (x1 + x2) / 2, top + 50, 28, '#d9412b');
        }
        if (a.safe) {
          const [g1, g2] = a.safe;
          ctx.fillStyle = 'rgba(80,190,90,.28)';
          ctx.fillRect(g1, top, g2 - g1, H - 30 - top);
          outlinedText('ここ！', (g1 + g2) / 2, H - 120, 18, '#2e8b3e');
        }
        // 残り時間バー
        ctx.fillStyle = '#d9412b';
        ctx.fillRect(0, top - 6, W * (1 - a.t / a.warn), 4);
      } else {
        // 発動：ビールの滝
        const k = Math.min(1, (a.t - a.warn) / 0.12);
        for (const [x1, x2] of a.rects) {
          const g = ctx.createLinearGradient(0, 0, 0, H);
          g.addColorStop(0, 'rgba(247,183,51,.9)');
          g.addColorStop(1, 'rgba(217,130,11,.95)');
          ctx.fillStyle = g;
          ctx.fillRect(x1, 0, x2 - x1, (H - 30) * k);
          ctx.fillStyle = 'rgba(255,250,240,.55)';
          for (let sx = x1 + 6; sx < x2 - 4; sx += 14) {
            const off = ((a.t * 900) + sx * 7) % 80;
            for (let sy = -80 + off; sy < (H - 30) * k; sy += 80) ctx.fillRect(sx, sy, 3, 30);
          }
          ctx.fillStyle = '#fffaf0';
          for (let fx = x1; fx < x2; fx += 16) {
            ctx.beginPath();
            ctx.arc(fx + 8, H - 32, 9 + Math.sin(time * 20 + fx) * 3, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }
    }
  }

  function drawBoss(boss) {
    const wob = Math.sin(time * 6 + boss.x * 0.01) * 3;
    const wind = boss.windup > 0 ? Math.sin(boss.windup * 60) * 4 : 0;
    const x = boss.x + wind, y = boss.y + wob;

    ctx.fillStyle = '#1d1d1f';
    ctx.beginPath();
    ctx.ellipse(x, y + boss.r + 10, boss.r * 0.95, 28, 0, Math.PI, 0);
    ctx.fill();

    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, boss.r, 0, Math.PI * 2);
    ctx.closePath();
    ctx.fillStyle = '#e0b48a';
    ctx.fill();
    ctx.clip();
    if (faceImg.complete && faceImg.naturalWidth) {
      ctx.drawImage(faceImg, x - boss.r, y - boss.r, boss.r * 2, boss.r * 2);
    }
    ctx.restore();
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#f2a516';
    ctx.beginPath();
    ctx.arc(x, y, boss.r, 0, Math.PI * 2);
    ctx.stroke();

    if (boss.windup > 0 && state === 'play') {
      const right = boss.x > W / 2;
      outlinedText('それっ！', right ? x - boss.r - 6 : x + boss.r + 6, y - 10, 18, '#d9412b', right ? 'right' : 'left');
    }
    if (state === 'over') outlinedText('カンパーイ！', x, y + boss.r + 34, 22, '#d9412b');
  }

  function drawBeer(b) {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.rot);
    ctx.strokeStyle = 'rgba(255,255,255,.85)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(13, 2, 7, -Math.PI / 2, Math.PI / 2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    roundRect(-13, -17, 26, 34, 4);
    ctx.fill();
    const g = ctx.createLinearGradient(0, -8, 0, 16);
    g.addColorStop(0, '#f7b733');
    g.addColorStop(1, '#d9820b');
    ctx.fillStyle = g;
    roundRect(-11, -8, 22, 23, 3);
    ctx.fill();
    ctx.fillStyle = '#fffaf0';
    ctx.beginPath();
    ctx.arc(-7, -10, 6, 0, Math.PI * 2);
    ctx.arc(0, -12, 7, 0, Math.PI * 2);
    ctx.arc(7, -10, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(-12, -10, 24, 4);
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.fillRect(-8, -4, 3, 16);
    ctx.restore();
  }

  function drawPlayer() {
    const p = player;
    const leg = Math.sin(p.step) * 6;

    ctx.save();
    ctx.translate(p.x, p.y);

    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath();
    ctx.ellipse(0, 30, 18, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#2d3a5a';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-6, 12); ctx.lineTo(-6 + leg, 27);
    ctx.moveTo(6, 12); ctx.lineTo(6 - leg, 27);
    ctx.stroke();

    ctx.fillStyle = p.hurt ? '#e0a33a' : '#3a8ee6';
    roundRect(-14, -12, 28, 28, 8);
    ctx.fill();

    ctx.strokeStyle = '#ffd7b0';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(-13, -4); ctx.lineTo(-19, 10 - leg / 2);
    ctx.moveTo(13, -4); ctx.lineTo(19, 10 + leg / 2);
    ctx.stroke();

    ctx.fillStyle = '#ffd7b0';
    ctx.beginPath();
    ctx.arc(0, -26, 15, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#3a2410';
    ctx.beginPath();
    ctx.arc(0, -30, 15, Math.PI * 1.05, Math.PI * 1.95);
    ctx.fill();

    ctx.fillStyle = '#3a2410';
    const fx = p.face * 3;
    if (p.hurt) {
      ctx.font = 'bold 10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('×  ×', fx, -23);
      ctx.beginPath();
      ctx.arc(fx, -17, 3, 0, Math.PI);
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(fx - 5, -25, 2, 0, Math.PI * 2);
      ctx.arc(fx + 5, -25, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#3a2410';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(fx - 3, -18); ctx.lineTo(fx + 3, -18);
      ctx.stroke();
      // 高レベルでは冷や汗
      if (level >= 5) {
        ctx.fillStyle = '#7cc4ff';
        ctx.beginPath();
        ctx.ellipse(12, -30 + (time * 30 % 10), 2.5, 4, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    if (p.hurt) {
      ctx.fillStyle = 'rgba(255,250,235,.95)';
      ctx.beginPath();
      ctx.arc(-8, -40, 8, 0, Math.PI * 2);
      ctx.arc(3, -43, 9, 0, Math.PI * 2);
      ctx.arc(12, -38, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(242,165,22,.55)';
      for (let i = 0; i < 4; i++) {
        const dy = ((endTimer * 40 + i * 13) % 40);
        ctx.fillRect(-12 + i * 8, -14 + dy, 3, 6);
      }
    }
    ctx.restore();
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.max * 1.5));
      ctx.fillStyle = p.foam ? '#fffaf0' : '#f2a516';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawHUD() {
    // レベル表示
    const lv = `Lv.${level} ${levelName(level)}`;
    ctx.font = 'bold 15px sans-serif';
    const lw = ctx.measureText(lv).width;
    ctx.fillStyle = level >= 9 ? 'rgba(217,65,43,.9)' : 'rgba(58,36,16,.85)';
    roundRect(10, 166, lw + 20, 28, 14);
    ctx.fill();
    ctx.fillStyle = '#fff7e6';
    ctx.textAlign = 'left';
    ctx.fillText(lv, 20, 186);

    // よけた数
    const label = `よけた ${dodged}`;
    ctx.font = 'bold 16px sans-serif';
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = 'rgba(58,36,16,.85)';
    roundRect(W - tw - 34, 166, tw + 24, 28, 14);
    ctx.fill();
    ctx.fillStyle = '#fff7e6';
    ctx.fillText(label, W - tw - 22, 186);

    // 次のレベルまでのジョッキゲージ
    const inLevel = dodged % PER_LEVEL;
    for (let i = 0; i < PER_LEVEL; i++) {
      const x = 12 + i * 13;
      const y = 200;
      ctx.fillStyle = i < inLevel ? '#f2a516' : 'rgba(58,36,16,.22)';
      roundRect(x, y, 9, 12, 2);
      ctx.fill();
    }

    for (const p of popups) {
      ctx.globalAlpha = Math.min(1, p.life * 2);
      outlinedText(p.text, p.x, p.y, 16, p.color || '#3a8ee6');
    }
    ctx.globalAlpha = 1;

    if (banner) {
      const a = Math.min(1, banner.life * 2);
      const pop = 1 + Math.max(0, banner.life - 1.4) * 0.6;
      ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(43,26,14,.75)';
      ctx.fillRect(0, H * 0.42 - 44, W, 92);
      ctx.save();
      ctx.translate(W / 2, H * 0.42);
      ctx.scale(pop, pop);
      outlinedText(banner.title, 0, 0, 30, '#f2a516');
      outlinedText(banner.sub, 0, 34, 20, level >= 9 ? '#d9412b' : '#3a2410');
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }

  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    // 高レベルは酔っぱらって画面がゆらゆら
    const sway = state === 'play' ? params(level, 0).sway : 0;
    if (sway) {
      ctx.translate(W / 2, H / 2);
      ctx.rotate(Math.sin(time * 1.3) * sway);
      ctx.translate(-W / 2, -H / 2);
    }
    drawBackground();
    drawAreas();
    for (const b of bosses) drawBoss(b);
    for (const b of beers) drawBeer(b);
    drawPlayer();
    drawParticles();
    if (state !== 'title') drawHUD();
    if (state === 'over' && endTimer < 0.5) {
      ctx.fillStyle = `rgba(242,165,22,${0.5 * (1 - endTimer / 0.5)})`;
      ctx.fillRect(-40, -40, W + 80, H + 80);
    }
    ctx.restore();
  }

  // ---------- ループ ----------
  reset();
  resize();
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    if (!paused) update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

})();
</script>
</body>
</html>
