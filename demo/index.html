<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noimageindex">
<meta name="theme-color" content="#2b1a0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ビールよけ 体験版">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>ビールよけ 体験版</title>
<style>
  :root {
    --bg: #2b1a0e;
    --panel: #fff7e6;
    --ink: #3a2410;
    --accent: #f2a516;
    --accent-dark: #a86e07;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  #app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: env(safe-area-inset-top);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }
  #field {
    flex: 1;
    width: 100%;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas { display: block; }

  #controls {
    touch-action: none;
    width: 100%;
    max-width: 520px;
    display: flex;
    gap: 12px;
    padding: 6px 12px calc(8px + env(safe-area-inset-bottom));
  }
  .pad {
    flex: 1;
    height: 60px;
    border: none;
    border-radius: 16px;
    background: #4a2f19;
    color: var(--accent);
    font-size: 26px;
    box-shadow: 0 4px 0 #1a0f07;
    pointer-events: none;
  }
  .pad.on {
    background: var(--accent);
    color: var(--bg);
    transform: translateY(4px);
    box-shadow: 0 2px 0 #1a0f07;
  }

  #pauseBtn {
    position: absolute;
    top: calc(10px + env(safe-area-inset-top));
    right: calc(10px + env(safe-area-inset-right));
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    background: rgba(58,36,16,.75);
    color: var(--panel);
    font-size: 18px;
    font-weight: bold;
    display: none;
  }
  #pauseBtn.show { display: block; }

  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
    text-align: center;
    background: rgba(43, 26, 14, .82);
    color: var(--panel);
    z-index: 10;
  }
  .overlay.hidden { display: none; }
  /* 画面が低いスマホでは中身をスクロールできるようにする */
  .overlay { overflow-y: auto; touch-action: pan-y; }
  .overlay > :first-child { margin-top: auto; }
  .overlay > :last-child { margin-bottom: auto; }
  .overlay a.buy {
    display: inline-block;
    margin-top: 10px;
    padding: 10px 26px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--ink);
    font-weight: bold;
    text-decoration: none;
  }
  .faceTools { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .faceTools button { min-width: 0 !important; margin-top: 0 !important; }
  #cropScreen, #lockScreen { background: var(--bg); z-index: 25; }
  /* クリア画面：紙吹雪がひらひら舞う */
  #clearScreen {
    z-index: 26;
    background: radial-gradient(circle at 50% 35%, #5a3a12 0%, #2b1a0e 70%);
  }
  #clearScreen > * { margin-top: 0; margin-bottom: 0; position: relative; z-index: 1; }
  #clearScreen > #confetti { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  #clearScreen .congrats { font-size: clamp(28px, 9vw, 44px); white-space: nowrap; color: #ffd34d; animation: pop 1.2s ease-in-out infinite alternate; }
  #clearScreen .clearLead { font-size: 20px; }
  #clearScreen .face { border-color: #ffd34d; box-shadow: 0 0 30px rgba(255,211,77,.6); }
  @keyframes pop { from { transform: scale(1); } to { transform: scale(1.08); } }
  #cropCanvas { border-radius: 50%; border: 5px solid var(--accent); touch-action: none; background: #222; }
  #cropZoom { width: 230px; accent-color: var(--accent); }
  .overlay input[type=text] {
    font: inherit;
    font-size: 20px;
    width: 240px;
    padding: 12px 16px;
    border-radius: 14px;
    border: 3px solid var(--accent);
    text-align: center;
    background: var(--panel);
    color: var(--ink);
  }
  .overlay h1 {
    margin: 0;
    font-size: 42px;
    letter-spacing: .05em;
    color: var(--accent);
    text-shadow: 0 3px 0 #7a4a06;
  }
  .overlay p { margin: 0; line-height: 1.7; font-size: 16px; }
  .overlay .face {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    border: 5px solid var(--accent);
    object-fit: cover;
  }
  .overlay button {
    margin-top: 6px;
    min-width: 220px;
    font: inherit;
    font-size: 22px;
    font-weight: bold;
    padding: 16px 36px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: var(--ink);
    box-shadow: 0 6px 0 var(--accent-dark);
  }
  .overlay button:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--accent-dark); }
  .overlay button.sub {
    background: transparent;
    color: var(--panel);
    box-shadow: none;
    border: 2px solid rgba(255,247,230,.5);
    font-size: 16px;
    padding: 10px 24px;
  }
  .small { font-size: 13px !important; opacity: .8; }
  .best { color: var(--accent); font-weight: bold; }

  #rotate { display: none; }
  @media (orientation: landscape) and (max-height: 500px) {
    #rotate { display: flex; z-index: 20; background: var(--bg); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="field"><canvas id="game"></canvas></div>
  <div id="controls">
    <button class="pad" id="leftBtn" aria-label="左へ">◀</button>
    <button class="pad" id="rightBtn" aria-label="右へ">▶</button>
  </div>
  <button id="pauseBtn" aria-label="一時停止">II</button>
</div>

<div class="overlay" id="startScreen">
  <img class="face" src="oyaji.png" alt="">
  <h1>ビールよけ</h1>
  <p>あいつがビールをかけてくる！<br>よけるほどレベルアップ<br>1杯でも浴びたらゲームオーバー</p>
  <p class="small">⚠ 赤いエリアは「範囲攻撃」。すぐ逃げろ！</p>
  <p class="small">◀ ▶ ボタンを押す or 画面をなぞって動かす</p>
  <p class="best" id="bestText"></p>
  <button id="startBtn">スタート</button>
</div>

<div class="overlay hidden" id="pauseScreen">
  <h1>ひと休み</h1>
  <p>ビールは待ってくれている…</p>
  <button id="resumeBtn">つづける</button>
  <button class="sub" id="quitBtn">タイトルへ</button>
</div>

<div class="overlay hidden" id="endScreen">
  <img class="face" src="oyaji.png" alt="">
  <h1 id="endTitle"></h1>
  <p id="endText"></p>
  <button id="retryBtn">もう一回</button>
  <button class="sub" id="titleBtn">タイトルへ</button>
</div>

<div class="overlay hidden" id="clearScreen">
  <canvas id="confetti"></canvas>
  <img class="face" src="oyaji.png" alt="">
  <h1 class="congrats">🎉 おめでとう！ 🎉</h1>
  <p class="clearLead">素戔嗚尊を超えて<br><b>全制覇</b>しました！</p>
  <p id="clearText"></p>
  <button id="continueBtn">無限の宴へ（続ける）</button>
  <button class="sub" id="clearTitleBtn">タイトルへ</button>
</div>

<div class="overlay" id="rotate">
  <h1>📱</h1>
  <p>スマホを縦にして遊んでね</p>
</div>

<script>window.GAME_CONFIG = {"variant": "demo", "face": "oyaji.png", "faceSwap": false, "maxLevel": 4, "buyUrl": ""};
</script>
<script>
(() => {
  const W = 400;
  let H = 640;
  // レベルアップに必要な杯数。Lv.1・2 はすぐ越えられるように少なく。
  // 2人が5方向に投げてくる後半は、1回で最大10杯よけることになるので、
  // 「5回くらいよけたら次のステージ」になるように多めにする（Lv.9 以降は各50杯）
  const LEVEL_SIZES = [2, 3, 10, 10, 10, 20, 30, 40];
  const levelSize = L => LEVEL_SIZES[L - 1] || 50;
  // 画面上部のレイアウト（顔を小さくして盤面を広く）
  const BOSS_Y = 66, BOSS_R = 40;
  const HUD_Y = 122;
  const AREA_TOP = HUD_Y + 50;
  function levelStart(L) {
    let s = 0;
    for (let i = 1; i < L; i++) s += levelSize(i);
    return s;
  }
  // 飲み会が進むほど深みにはまっていく。伝説の大酒飲みの鬼「酒呑童子」、酒の神「バッカス」、
  // 八つの樽を飲み干す大蛇「ヤマタノオロチ」を越え、最後に待つのはその大蛇を酒で酔わせて退治した「素戔嗚尊」
  const LEVEL_NAMES = ['ほろ酔い', '一杯目', 'ほろほろ', '二次会', 'ハシゴ酒', '泥酔', '記憶なし', '地獄の飲み会',
    '終電なし', '朝まで', '迎え酒', 'ザル', 'うわばみ', '酒呑童子', 'バッカス', 'ヤマタノオロチ', '素戔嗚尊'];
  const levelName = L => LEVEL_NAMES[Math.min(L, LEVEL_NAMES.length) - 1];
  // 最後のレベル（素戔嗚尊）を越えたらクリア。その後は無限に続けられる
  const CLEAR_LEVEL = LEVEL_NAMES.length;

  // ---------- セリフ（レベルごとに変わる） ----------
  // throw: 投げるとき / area: 範囲攻撃 / gap: 安全地帯以外ぜんぶ / intro: レベルアップ時
  const LINES = [
    { // Lv.1 ほろ酔い
      throw: ['それっ！', 'ほいっ！', 'えいっ！', 'どうぞ〜', '一杯どう？'],
      intro: ['軽く飲もうか'],
    },
    { // Lv.2 一杯目
      throw: ['乾杯だ！', '飲め飲め！', 'とりあえず生！', 'まずは一杯！', 'グイッと！'],
      area: ['ビールの滝！', 'ドバーッ！'],
      intro: ['まだ一杯目だぞ'],
    },
    { // Lv.3 ほろほろ
      throw: ['おかわり！', 'まだまだ！', '逃げるな〜', 'ほらほら！', 'よけるなよ'],
      area: ['ジョッキごと！', 'ドバドバ！'],
      intro: ['あったまってきた'],
    },
    { // Lv.4 二次会
      throw: ['二次会だ！', '次の店！', '帰さないぞ', '飲み足りん！', '終電？知らん'],
      area: ['ダブルで！', '滝2本！'],
      intro: ['二次会いくぞ！'],
    },
    { // Lv.5 ハシゴ酒
      throw: ['もう一軒！', 'ハシゴだ！', '朝まで！', 'ビールの雨！', '店員さん生！'],
      area: ['大ジョッキ！', '樽ごと！'],
      gap: ['そこしかないぞ', '逃げ場1つ！'],
      intro: ['ハシゴ酒だ！'],
    },
    { // Lv.6 泥酔
      throw: ['うぇ〜い！', 'ひっく！', 'わははは！', '何杯目だっけ', '分身したぞ'],
      area: ['ひっく…ドバー', '酔拳！'],
      gap: ['ここ以外ビール！', '狭いぞ〜'],
      intro: ['2人に増えたぞ'],
    },
    { // Lv.7 記憶なし
      throw: ['ここどこ？', '誰だっけ？', '記憶ないわ', 'ビール！ビール！', '世界が回る'],
      area: ['覚えてない！', '無意識ドバー'],
      gap: ['記憶の隙間へ', '逃げてみな'],
      intro: ['なにも覚えてない'],
    },
    { // Lv.8 地獄の飲み会
      throw: ['おかわり自由！', '逃がさん！', '全員飲め！', '飲み放題だ！', 'ラストオーダー！'],
      area: ['地獄の滝！', '飲み干せ！'],
      gap: ['生き残れるか？', '地獄の一本道'],
      intro: ['地獄へようこそ'],
    },
    { // Lv.9 終電なし
      throw: ['終電もうないよ', 'タクシーで帰れ', 'もう帰れないぞ', 'まだ飲めるだろ', 'ここからが本番'],
      area: ['終電ドバー！', '帰さん！'],
      gap: ['逃げ場は始発まで', '祈れ！'],
      intro: ['終電、行っちゃったね'],
    },
    { // Lv.10 朝まで
      throw: ['朝まで飲むぞ', '空が明るい！', '始発で帰るか', '朝日に乾杯！', 'まだ夜だよ'],
      area: ['朝焼けビール！', '夜明けの一杯！'],
      gap: ['朝日の当たる場所へ', '始発に間に合え'],
      intro: ['朝まで行くぞ！'],
    },
    { // Lv.11 迎え酒
      throw: ['頭いたい…飲む', '迎え酒だ！', '治すには飲む', 'しじみ汁より酒', 'ゆうべの続き'],
      area: ['二日酔いドバー', '迎えのビール！'],
      gap: ['水を飲め！', '逃げても酒'],
      intro: ['二日酔いには迎え酒'],
    },
    { // Lv.12 ザル
      throw: ['いくらでも入る', 'ザルだから平気', '水みたいなもん', '樽で持ってこい', 'まだシラフ'],
      area: ['樽ごといけ！', '底なし！'],
      gap: ['こぼれた所へ', 'すき間はそこだけ'],
      intro: ['ザルの本気を見よ'],
    },
    { // Lv.13 うわばみ
      throw: ['ひと飲みだ！', 'ぐびぐびぐび', '一升瓶で来い', '飲み干してやる', 'まるのみ！'],
      area: ['うわばみの大口！', '丸飲みだ！'],
      gap: ['飲まれるぞ', '逃げ道ひとつ'],
      intro: ['うわばみ、目覚める'],
    },
    { // Lv.14 酒呑童子
      throw: ['酒をもてい！', '鬼の一杯', '酒呑童子参上', '百杯目だ', '宴は終わらぬ'],
      area: ['鬼の瓢箪！', 'にごり酒の滝！'],
      gap: ['鬼から逃げろ', '大江山へ逃げろ'],
      intro: ['鬼が来たぞ…'],
    },
    { // Lv.15 バッカス
      throw: ['ワインもあるぞ', '神の宴だ！', 'ぶどう酒の雨！', '酔いこそ自由', '杯を掲げよ'],
      area: ['ワインの滝！', 'ぶどう畑ごと！'],
      gap: ['神は見ている', '酔いに身を任せろ'],
      intro: ['酒の神、降臨'],
    },
    { // Lv.16 ヤマタノオロチ
      throw: ['八つの口で飲む', '樽を持ってこい', 'ぐびぐびぐび×8', '八杯同時だ！', 'まだ足りぬ'],
      area: ['八つの樽を浴びろ！', '大蛇の酒しぶき！'],
      gap: ['八つの首から逃げろ', '首のすき間へ'],
      intro: ['八つの首が酒を求める'],
    },
    { // Lv.17〜 素戔嗚尊
      throw: ['八塩折の酒だ', '八つの樽を飲め', '大蛇も酔わせた酒', '高天原の宴じゃ', '嵐とともに！'],
      area: ['八岐の酒樽！', '嵐の酒！'],
      gap: ['天岩戸へ逃げろ', '神話のすき間へ'],
      intro: ['素戔嗚尊、見参'],
    },
  ];
  // ---------- お酒の種類（神様レベルはちなんだお酒に変わる） ----------
  const DRINKS = {
    beer: { name: 'ビール', liquid: '#f2a516', foam: '#fffaf0', top: '#f9c046', bottom: '#d9820b', rgb: '242,165,22',
            drip: 'rgba(255,250,235,.9)', streak: 'rgba(255,250,240,.5)', edge: 'rgba(180,110,10,.4)' },
    wine: { name: 'ワイン', liquid: '#9b1d42', foam: '#e07a98', top: '#b3264f', bottom: '#5e0b26', rgb: '155,29,66',
            drip: 'rgba(155,29,66,.9)', streak: 'rgba(255,180,200,.3)', edge: 'rgba(60,0,20,.5)' },
    nigori: { name: 'にごり酒', liquid: '#efe9da', foam: '#ffffff', top: '#fbf8f0', bottom: '#d8cfb8', rgb: '230,222,200',
            drip: 'rgba(245,240,228,.95)', streak: 'rgba(255,255,255,.6)', edge: 'rgba(140,120,90,.6)' },
    sake: { name: '日本酒', liquid: '#bfe0ef', foam: '#ffffff', top: '#f2fbff', bottom: '#a3cde2', rgb: '150,200,225',
            drip: 'rgba(205,232,245,.95)', streak: 'rgba(255,255,255,.8)', edge: 'rgba(80,130,160,.7)' },
  };
  // レベルごとの「投げてくる器」と「範囲攻撃で注いでくる容器」
  const STYLES = {
    beer:    { drink: 'beer', cup: 'mug',       pourer: 'bottle' },     // ジョッキとビール瓶
    shuten:  { drink: 'nigori', cup: 'choko',   pourer: 'hyotan' },     // 酒呑童子：お猪口と大瓢箪（にごり酒）
    bacchus: { drink: 'wine', cup: 'wineglass', pourer: 'winebottle' }, // バッカス：ワイングラスとワインボトル
    orochi:  { drink: 'sake', cup: 'masu',      pourer: 'taru' },       // ヤマタノオロチ：升と酒樽
    susanoo: { drink: 'sake', cup: 'sakazuki',  pourer: 'tokkuri' },    // 素戔嗚尊：朱塗りの盃と大徳利（八塩折の酒）
  };
  function styleFor(L) {
    const name = levelName(L);
    return name === '素戔嗚尊' ? 'susanoo' : name === 'ヤマタノオロチ' ? 'orochi' : name === 'バッカス' ? 'bacchus'
      : name === '酒呑童子' ? 'shuten' : 'beer';
  }
  const drinkOf = style => DRINKS[STYLES[style || 'beer'].drink];

  const GAME_OVER_LINES = ['カンパーイ！', '乾杯成功！', 'いい飲みっぷり！', 'びしょ濡れ〜', 'もう一杯いく？'];
  const pick = a => a[Math.floor(Math.random() * a.length)];
  // そのレベルのセリフがなければ、前のレベルのセリフを使う
  function line(kind, L) {
    for (let i = Math.min(L, LINES.length) - 1; i >= 0; i--) {
      if (LINES[i][kind]) return pick(LINES[i][kind]);
    }
    return 'それっ！';
  }

  // 版ごとの設定（体験版・製品版はビルド時に GAME_CONFIG を差し込む）
  //   variant: 記録や顔写真の保存先を版ごとに分ける名前
  //   face: 最初の顔画像 / faceSwap: 顔写真の差し替え機能
  //   maxLevel: 体験版の上限レベル（0 なら無制限） / buyUrl: 製品版の購入ページ
  const CFG = Object.assign(
    { variant: 'main', face: 'oyaji.png', faceSwap: false, maxLevel: 0, buyUrl: '' },
    window.GAME_CONFIG || {}
  );
  const storeKey = name => 'beer-dodge-' + name + (CFG.variant === 'main' ? '' : '-' + CFG.variant);

  const $ = id => document.getElementById(id);
  const canvas = $('game');
  const ctx = canvas.getContext('2d');
  const field = $('field');
  const startScreen = $('startScreen');
  const pauseScreen = $('pauseScreen');
  const endScreen = $('endScreen');
  const pauseBtn = $('pauseBtn');

  const faceImg = new Image();
  function setFace(src) {
    faceImg.src = src;
    document.querySelectorAll('img.face').forEach(img => { img.src = src; });
  }
  let customFace = null;
  if (CFG.faceSwap) {
    try { customFace = localStorage.getItem(storeKey('face')); } catch (_) {}
  }
  setFace(customFace || CFG.face);

  // ---------- 記録 ----------
  const BEST_KEY = storeKey('best');
  function loadBest() {
    try {
      const b = JSON.parse(localStorage.getItem(BEST_KEY)) || {};
      return { score: b.score || b.dodged || 0, level: b.level || 1, cleared: !!b.cleared, clears: b.clears || 0 };
    } catch (_) { return { score: 0, level: 1, cleared: false, clears: 0 }; }
  }
  function saveBest(b) {
    try { localStorage.setItem(BEST_KEY, JSON.stringify(b)); } catch (_) {}
  }
  let best = loadBest();
  function showBest() {
    $('bestText').textContent = best.score > 0
      ? `ベスト：${best.score}杯（Lv.${best.level} ${levelName(best.level)}）` +
        (best.cleared ? `　👑全制覇 ${best.clears}回` : '')
      : '';
  }
  showBest();

  // ---------- 難易度 ----------
  // レベルが上がるほど速く・多く・容赦なくなる。Lv.9 以降はかなり理不尽。
  // Lv.5 までは同じ上がり方。そこから先はゆっくり上がり、最後の素戔嗚尊（Lv.17）で最高難度になる
  const LAST = 17;
  const ramp = (L, at5, atLast) => L <= 5 ? null : at5 + (atLast - at5) * Math.min(1, (L - 5) / (LAST - 5));
  function baseSpeed(L) {
    if (L <= 5) return 240 + L * 55;               // Lv.5 で 515
    if (L <= 8) return 515 + (L - 5) * 25;         // Lv.8 で 590
    return 590 + (980 - 590) * Math.min(1, (L - 8) / (LAST - 8)); // Lv.17 で 980
  }
  function params(L, inLevel) {
    return {
      speed: Math.min(980, baseSpeed(L) + Math.min(inLevel, 10) * 4),
      interval: L <= 5 ? 1.3 - L * 0.13 : ramp(L, 0.65, 0.16),
      fan: L >= 15 ? 5
         : L >= 12 ? (Math.random() < 0.5 ? 3 : 5)
         : L >= 5 ? 3
         : L >= 3 ? (Math.random() < 0.5 ? 1 : 2)
         : 1,
      lead: L <= 5 ? 0.12 * (L - 1) : ramp(L, 0.48, 0.9),
      bossSpeed: 70 + L * 20,
      areaInterval: Math.max(3.2, 8 - L * 0.5),
      warn: Math.max(0.75, 1.3 - L * 0.06),
      playerSpeed: 440 + Math.min(L, 10) * 10,
      sway: L >= 7 ? Math.min(0.05, (L - 6) * 0.012) : 0,
    };
  }

  // ---------- 画面サイズ（縦長スマホは画面いっぱいに） ----------
  let scale = 1;
  function resize() {
    const r = field.getBoundingClientRect();
    scale = Math.min(r.width / W, r.height / 560);
    H = Math.round(Math.min(1000, Math.max(560, r.height / scale)));
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.style.width = (W * scale) + 'px';
    canvas.style.height = (H * scale) + 'px';
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    if (player) player.y = H - 70;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));

  // iOS のピンチズーム・ダブルタップズームを防ぐ
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());
  document.addEventListener('contextmenu', e => e.preventDefault());

  // ---------- 音と振動 ----------
  let audio = null;
  function beep(freq, dur, type = 'square', vol = 0.06, slide = 0) {
    if (!audio) return;
    const t = audio.currentTime;
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audio.destination);
    o.start(t);
    o.stop(t + dur);
  }
  function vibrate(p) {
    try { if (navigator.vibrate) navigator.vibrate(p); } catch (_) {}
  }
  const sfx = {
    throw: () => beep(500, 0.15, 'triangle', 0.06, -250),
    dodge: () => { beep(880, 0.06, 'square', 0.03); vibrate(10); },
    warn: () => { beep(330, 0.12, 'square', 0.05); setTimeout(() => beep(330, 0.12, 'square', 0.05), 160); },
    pour: () => beep(160, 0.45, 'sawtooth', 0.05, -80),
    area: () => { beep(1046, 0.1, 'square', 0.04); vibrate(25); },
    slip: () => { beep(1318, 0.07, 'square', 0.04); setTimeout(() => beep(1760, 0.09, 'square', 0.04), 70); vibrate([15, 30, 15]); },
    splash: () => { beep(200, 0.5, 'sawtooth', 0.08, -150); beep(120, 0.6, 'square', 0.05, -60); vibrate([120, 60, 220]); },
    clear: () => { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => setTimeout(() => beep(f, 0.22, 'square', 0.06), i * 140)); vibrate([60, 40, 60, 40, 200]); },
    levelUp: () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.16, 'square', 0.05), i * 100)); vibrate([30, 30, 30, 30, 80]); },
  };
  function unlockAudio() {
    if (!audio) {
      try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { audio = null; }
    }
    if (audio && audio.state === 'suspended') audio.resume();
  }

  // ---------- 入力 ----------
  // 指（ポインター）ごとに入力を管理し、最後に触れた指・キーを優先する。
  // ◀▶ を同時に押しても止まらず、指を滑らせれば向きが切り替わる。
  const touches = new Map();
  let inputOrder = 0;
  const keys = { left: 0, right: 0 };
  const controls = $('controls');
  const leftBtn = $('leftBtn');
  const rightBtn = $('rightBtn');

  const keySide = k => (k === 'ArrowLeft' || k === 'a' || k === 'A') ? 'left'
    : (k === 'ArrowRight' || k === 'd' || k === 'D') ? 'right' : null;
  window.addEventListener('keydown', e => {
    const side = keySide(e.key);
    if (side && !keys[side]) keys[side] = ++inputOrder;
    if (e.key === 'Escape' || e.key === 'p') togglePause();
  });
  window.addEventListener('keyup', e => {
    const side = keySide(e.key);
    if (side) keys[side] = 0;
  });

  function toGameX(clientX) {
    const r = canvas.getBoundingClientRect();
    return (clientX - r.left) / scale;
  }
  function padDir(clientX) {
    const r = controls.getBoundingClientRect();
    return clientX < r.left + r.width / 2 ? -1 : 1;
  }
  function updatePadVisual() {
    let l = false, r = false;
    for (const t of touches.values()) {
      if (t.kind === 'pad') { if (t.dir < 0) l = true; else r = true; }
    }
    leftBtn.classList.toggle('on', l);
    rightBtn.classList.toggle('on', r);
  }
  function capture(el, id) {
    try { el.setPointerCapture(id); } catch (_) {}
  }

  // ◀▶ ボタンの帯全体をタッチ領域にする（ボタンの隙間を押しても反応する）
  controls.addEventListener('pointerdown', e => {
    e.preventDefault();
    touches.set(e.pointerId, { kind: 'pad', dir: padDir(e.clientX), order: ++inputOrder });
    capture(controls, e.pointerId);
    updatePadVisual();
  });
  controls.addEventListener('pointermove', e => {
    const t = touches.get(e.pointerId);
    if (t && t.kind === 'pad') {
      const d = padDir(e.clientX);
      if (d !== t.dir) { t.dir = d; t.order = ++inputOrder; updatePadVisual(); }
    }
  });

  // 画面をなぞると指の位置へ動く
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    touches.set(e.pointerId, { kind: 'drag', x: toGameX(e.clientX), order: ++inputOrder });
    capture(canvas, e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    const t = touches.get(e.pointerId);
    if (t && t.kind === 'drag') t.x = toGameX(e.clientX);
  });

  function endTouch(e) {
    if (touches.delete(e.pointerId)) updatePadVisual();
  }
  function clearInput() {
    touches.clear();
    keys.left = keys.right = 0;
    updatePadVisual();
  }
  // 指を離したイベントはどこで起きても必ず拾う
  window.addEventListener('pointerup', endTouch, true);
  window.addEventListener('pointercancel', endTouch, true);
  // 念のため：画面から指が全部離れたら入力をリセット（押しっぱなし誤認の防止）
  window.addEventListener('touchend', e => { if (e.touches.length === 0) clearInput(); }, true);
  window.addEventListener('touchcancel', e => { if (e.touches.length === 0) clearInput(); }, true);
  window.addEventListener('blur', clearInput);

  function activeInput() {
    let best = null;
    for (const t of touches.values()) if (!best || t.order > best.order) best = t;
    for (const side of ['left', 'right']) {
      if (keys[side] && (!best || keys[side] > best.order)) {
        best = { kind: 'pad', dir: side === 'left' ? -1 : 1, order: keys[side] };
      }
    }
    return best;
  }

  function inputDir() {
    const t = activeInput();
    if (!t) return 0;
    if (t.kind === 'pad') return t.dir;
    const diff = t.x - player.x;
    return Math.abs(diff) < 1 ? 0 : Math.sign(diff);
  }

  // ---------- ゲーム状態 ----------
  let state = 'title';
  let paused = false;
  let player, bosses, beers, areas, particles, popups;
  let dodged, level, throwTimer, areaTimer, levelPause, banner, shake, time, endTimer, deathBy, nextBoss, lastStyle, cleared;
  let volleys, volleyId;

  function makeBoss(x, dir) {
    return { x, y: BOSS_Y, r: BOSS_R, dir, windup: 0, shout: '', shoutLife: 0 };
  }

  function reset() {
    player = { x: W / 2, y: H - 70, w: 34, h: 56, face: 1, step: 0, hurt: false };
    bosses = [makeBoss(W / 2, 1)];
    bg = null;
    lightning = 0;
    beers = [];
    areas = [];
    particles = [];
    popups = [];
    dodged = 0;
    level = 1;
    throwTimer = 1.2;
    areaTimer = 0;
    levelPause = 0;
    banner = null;
    shake = 0;
    time = 0;
    endTimer = 0;
    deathBy = '';
    lastStyle = 'beer';
    cleared = false;
    nextBoss = 0;
    volleys = new Map();
    volleyId = 0;
  }

  function start() {
    unlockAudio();
    reset();
    state = 'play';
    paused = false;
    startScreen.classList.add('hidden');
    endScreen.classList.add('hidden');
    pauseScreen.classList.add('hidden');
    pauseBtn.classList.add('show');
    banner = { text: `Lv.1 ${levelName(1)}`, life: 0.9, max: 0.9 };
  }

  function toTitle() {
    reset();
    state = 'title';
    paused = false;
    showBest();
    pauseScreen.classList.add('hidden');
    endScreen.classList.add('hidden');
    startScreen.classList.remove('hidden');
    pauseBtn.classList.remove('show');
  }

  function setPaused(p) {
    if (state !== 'play' || !clearScreen.classList.contains('hidden')) return;
    paused = p;
    pauseScreen.classList.toggle('hidden', !p);
    if (!p) unlockAudio();
  }
  function togglePause() { setPaused(!paused); }

  $('startBtn').addEventListener('click', start);
  $('retryBtn').addEventListener('click', start);
  $('titleBtn').addEventListener('click', toTitle);
  $('quitBtn').addEventListener('click', toTitle);
  $('resumeBtn').addEventListener('click', () => setPaused(false));
  pauseBtn.addEventListener('click', () => setPaused(true));
  // アプリを切り替えたら自動で一時停止
  document.addEventListener('visibilitychange', () => { if (document.hidden) setPaused(true); });

  // ---------- スコア・レベル ----------
  const AREA_BONUS = 3;
  const SLIP_BONUS = 2;
  function addDodge(text, x, y, n = 1, big = false, color) {
    dodged += n;
    popups.push({ x, y, text, life: big ? 1.1 : 0.7, size: big ? 24 : 16, color: color || (big ? '#e08a00' : undefined) });
    if (cleared) return;
    if (level < CLEAR_LEVEL && dodged >= levelStart(level + 1)) levelUp(level + 1);
    else if (level >= CLEAR_LEVEL && dodged >= levelStart(CLEAR_LEVEL + 1)) gameClear();
  }

  // 素戔嗚尊を越えた！（ゲームはそのまま続く）
  function gameClear() {
    cleared = true;
    levelPause = 2;
    throwTimer = Math.max(throwTimer, 2);
    areaTimer = Math.max(areaTimer, 3);
    for (const b of bosses) say(b, '見事なり…', 2);
    sfx.clear();
    best.cleared = true;
    best.clears = (best.clears || 0) + 1;
    if (dodged > best.score) { best.score = dodged; best.level = level; }
    saveBest(best);
    showClearScreen();
  }

  // ---------- クリア画面 ----------
  const clearScreen = $('clearScreen');
  const confettiCv = $('confetti');
  const confettiCtx = confettiCv.getContext('2d');
  let confetti = [], confettiOn = false, confettiLast = 0;
  const CONFETTI_COLORS = ['#ffd34d', '#d9412b', '#fff7e6', '#7cc4ff', '#6ad18a', '#ff8fc8', '#e8b33a'];

  function newPiece(cw, ch, anywhere) {
    return {
      x: Math.random() * cw,
      y: anywhere ? Math.random() * ch : -20 - Math.random() * ch * 0.3,
      w: 6 + Math.random() * 7,
      h: 9 + Math.random() * 9,
      color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
      vy: 45 + Math.random() * 70,          // ゆっくり落ちる
      sway: 0.8 + Math.random() * 1.6,       // 左右にゆれる速さ
      swayAmp: 25 + Math.random() * 45,
      phase: Math.random() * Math.PI * 2,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 4,
      flip: 2 + Math.random() * 5,           // くるくる裏返る速さ
    };
  }

  function confettiFrame(now) {
    if (!confettiOn) return;
    const dt = Math.min(0.05, (now - confettiLast) / 1000 || 0);
    confettiLast = now;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cw = window.innerWidth, ch = window.innerHeight;
    if (confettiCv.width !== Math.round(cw * dpr) || confettiCv.height !== Math.round(ch * dpr)) {
      confettiCv.width = Math.round(cw * dpr);
      confettiCv.height = Math.round(ch * dpr);
    }
    const c = confettiCtx;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, cw, ch);
    const t = now / 1000;
    for (const p of confetti) {
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      if (p.y > ch + 20) Object.assign(p, newPiece(cw, ch, false), { y: -20 });
      const x = p.x + Math.sin(t * p.sway + p.phase) * p.swayAmp;
      c.save();
      c.translate(x, p.y);
      c.rotate(p.rot + Math.sin(t * p.sway + p.phase) * 0.6);
      c.scale(1, Math.cos(t * p.flip + p.phase));
      c.fillStyle = p.color;
      c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      c.restore();
    }
    requestAnimationFrame(confettiFrame);
  }

  function showClearScreen() {
    paused = true;
    pauseBtn.classList.remove('show');
    clearInput();
    $('clearText').innerHTML =
      `よけた数：<b>${dodged}</b> 杯<br>` +
      `<span class="small">全制覇 ${best.clears} 回目</span>`;
    clearScreen.classList.remove('hidden');
    const cw = window.innerWidth, ch = window.innerHeight;
    confetti = Array.from({ length: 140 }, () => newPiece(cw, ch, true));
    confettiOn = true;
    confettiLast = performance.now();
    requestAnimationFrame(confettiFrame);
    vibrate([60, 40, 60, 40, 200]);
  }

  function hideClearScreen() {
    confettiOn = false;
    clearScreen.classList.add('hidden');
  }

  $('continueBtn').addEventListener('click', () => {
    hideClearScreen();
    unlockAudio();
    paused = false;
    pauseBtn.classList.add('show');
    levelPause = 1.5;
    throwTimer = Math.max(throwTimer, 1.5);
    areaTimer = Math.max(areaTimer, 3);
    banner = { text: '無限の宴、開幕！', life: 1.6, max: 1.6 };
  });
  $('clearTitleBtn').addEventListener('click', () => {
    hideClearScreen();
    toTitle();
  });

  function levelUp(L) {
    if (CFG.maxLevel && L > CFG.maxLevel) { demoEnd(); return; }
    level = L;
    levelPause = 1.4;
    throwTimer = Math.max(throwTimer, 1.4);
    areaTimer = Math.max(areaTimer, 2.2);
    banner = { text: `LEVEL UP! Lv.${L} ${levelName(L)}`, life: 0.9, max: 0.9 };
    sfx.levelUp();
    // Lv.6 からビールをかけてくる人が2人になる
    if (L >= 6 && bosses.length < 2) {
      const b = bosses[0];
      bosses.push(makeBoss(b.x > W / 2 ? 80 : W - 80, -b.dir));
      popups.push({ x: W / 2, y: AREA_TOP + 60, text: 'もう1人きた！', life: 1.6, color: '#d9412b' });
    }
    for (const b of bosses) say(b, line('intro', L), 1.6);
  }

  // ---------- 通常攻撃：ビールを投げる ----------
  function throwVolley(p) {
    const boss = bosses[nextBoss % bosses.length];
    nextBoss++;
    const sx = boss.x + (Math.random() - 0.5) * 30;
    const sy = boss.y + boss.r * 0.7;
    let tx = player.x + (Math.random() - 0.5) * 50;
    if (Math.random() < p.lead) {
      const dist = Math.hypot(tx - sx, player.y - sy);
      tx += inputDir() * p.playerSpeed * (dist / p.speed) * 0.7;
    }
    tx = Math.max(20, Math.min(W - 20, tx));

    // 複数投げるときは、角度を考えて「人が入れるすき間」が必ずできる間隔で並べる。
    // 端から斜めに投げたビールは横に流れるぶん、間隔を広く取る（等間隔にはならない）。
    // 通れるすき間の幅。2方向・3方向はやさしく広め、5方向は狭め
    const GAP = p.fan >= 5 ? 52 : 95;
    const dy = player.y - sy;
    const zoneOf = lx => dangerZone(lx, (lx - sx) / dy);
    function layout(center) {
      const xs = [center];
      let lo = center, hi = center;
      const goRightFirst = Math.random() < 0.5;
      for (let k = 1; k < p.fan; k++) {
        const right = (k % 2 === 1) === goRightFirst;
        if (right) {
          const edge = zoneOf(hi)[1] + GAP;
          let x = hi + 8;
          while (zoneOf(x)[0] < edge) x += 2;
          xs.push(x); hi = x;
        } else {
          const edge = zoneOf(lo)[0] - GAP;
          let x = lo - 8;
          while (zoneOf(x)[1] > edge) x -= 2;
          xs.push(x); lo = x;
        }
      }
      return xs;
    }

    // すでに飛んでいるビールとほぼ同時に着くなら、危ない範囲が「重なる」か
    // 「十分離れる」位置にずらす。人が通れない中途半端なすき間は作らない。
    const arrive = Math.hypot(tx - sx, dy) / p.speed;
    const others = [];
    for (const b of beers) {
      if (b.vy <= 0) continue;
      const t = (player.y - b.y) / b.vy;
      if (t > 0 && Math.abs(t - arrive) < 0.4) others.push(dangerZone(b.x + b.vx * t, b.vx / b.vy));
    }
    let xs = layout(tx);
    if (others.length) {
      let best = xs, bestCost = Infinity;
      for (let shift = -96; shift <= 96; shift += 4) {
        const cand = layout(tx + shift);
        let cost = Math.abs(shift) * 0.01;
        for (const lx of cand) {
          const z = zoneOf(lx);
          for (const o of others) {
            const g = Math.max(z[0], o[0]) - Math.min(z[1], o[1]);
            if (g > 0 && g < GAP) cost += GAP - g;
          }
        }
        if (cost < bestCost) { bestCost = cost; best = cand; }
      }
      // それでも狭いすき間ができるビールは投げない（理不尽な配置を作らない）
      xs = best.filter(lx => {
        const z = zoneOf(lx);
        return others.every(o => {
          const g = Math.max(z[0], o[0]) - Math.min(z[1], o[1]);
          return g <= 0 || g >= GAP;
        });
      });
      if (!xs.length) return;
    }

    const vid = ++volleyId;
    volleys.set(vid, { n: xs.length, left: false, right: false });
    for (const lx of xs) {
      const d = Math.hypot(lx - sx, dy);
      beers.push({
        x: sx, y: sy,
        vx: (lx - sx) / d * p.speed,
        vy: dy / d * p.speed,
        rot: 0,
        spin: (Math.random() < 0.5 ? -1 : 1) * (4 + Math.random() * 4),
        vid,
        style: styleFor(level),
      });
    }
    boss.windup = 0.25;
    // 前のセリフを読み切る前に次へ変わらないようにする
    if (boss.shoutLife <= 0) say(boss, line('throw', level), 0.7);
    sfx.throw();
  }

  // ---------- 範囲攻撃 ----------
  // pour: プレイヤー付近に太いビールの滝。gap: 安全地帯以外ぜんぶビール。
  // 理不尽にならないよう、必ず逃げ道が間に合う位置・幅で出す
  function startArea(p) {
    const ps = p.playerSpeed;
    const types = ['pour'];
    if (level >= 4) types.push('double');
    if (level >= 5) types.push('gap');
    const type = types[Math.floor(Math.random() * types.length)];
    let rects = [];
    let safe = null;

    if (type === 'pour' || type === 'double') {
      const w = 100 + Math.random() * Math.min(60, level * 8);
      const c = player.x + (Math.random() - 0.5) * 60;
      const x1 = Math.max(0, Math.min(W - w, c - w / 2));
      rects.push([x1, x1 + w]);
      if (type === 'double') {
        // 2本目は1本目から十分離して、間に逃げ場を残す
        const gapMin = 140;
        const w2 = 90 + Math.random() * 30;
        const leftRoom = x1 - gapMin;
        const rightRoom = W - (x1 + w + gapMin);
        if (rightRoom >= w2 || leftRoom >= w2) {
          const goRight = rightRoom >= w2 && (leftRoom < w2 || Math.random() < 0.5);
          const s2 = goRight
            ? x1 + w + gapMin + Math.random() * (rightRoom - w2)
            : Math.random() * (leftRoom - w2);
          rects.push([s2, s2 + w2]);
        }
      }
    } else {
      const gw = Math.max(110, 150 - level * 4);
      // 安全地帯は余裕で間に合う距離に置き、飛んでくるビールの落下地点はなるべく避ける
      const reach = ps * p.warn * 0.55;
      let bestC = player.x, bestScore = Infinity;
      for (let i = 0; i < 12; i++) {
        let c = player.x + (Math.random() * 2 - 1) * reach;
        c = Math.max(gw / 2 + 4, Math.min(W - gw / 2 - 4, c));
        let score = 0;
        for (const b of beers) {
          if (b.vy <= 0) continue;
          const x = b.x + b.vx * ((player.y - b.y) / b.vy);
          if (x > c - gw / 2 - 20 && x < c + gw / 2 + 20) score++;
        }
        if (score < bestScore) { bestScore = score; bestC = c; }
      }
      safe = [bestC - gw / 2, bestC + gw / 2];
      rects = [[0, safe[0]], [safe[1], W]];
    }
    areas.push({ rects, safe, t: 0, warn: p.warn, active: 0.6, poured: false, style: styleFor(level) });
    say(bosses[0], line(safe ? 'gap' : 'area', level), p.warn + 0.3, true);
    sfx.warn();
  }

  function inArea(a) {
    // 少しだけ甘めの判定
    const m = 12;
    return a.rects.some(([x1, x2]) => player.x > x1 + m && player.x < x2 - m);
  }

  function addSplash(x, y, n, big, style) {
    const d = STYLES[style || 'beer'].drink;
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2;
      const s = (big ? 120 : 40) + Math.random() * (big ? 260 : 80);
      particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s - (big ? 120 : 20),
        life: 0.6 + Math.random() * 0.6,
        max: 1.2,
        r: 2 + Math.random() * (big ? 6 : 3),
        foam: Math.random() < 0.35,
        d,
      });
    }
  }

  // 当たり判定は見た目より少し小さめ（ビール 18x24、人 34x56 の7〜8割）
  const HIT_HW = (18 + 34 * 0.7) / 2;
  const HIT_HH = (24 + 56 * 0.85) / 2;
  function rectHit(b) {
    return Math.abs(b.x - player.x) < HIT_HW &&
           Math.abs(b.y - (player.y - 4)) < HIT_HH;
  }

  // ビールが人の高さを通り過ぎるあいだに「人の中心が居てはいけない横の範囲」。
  // 斜めに飛ぶビールほど、通過中に横へ動くぶん範囲が広くなる。
  function dangerZone(lx, slope) {
    const a = lx + slope * (-4 - HIT_HH);
    const b = lx + slope * (-4 + HIT_HH);
    return [Math.min(a, b) - HIT_HW, Math.max(a, b) + HIT_HW];
  }

  // ---------- 更新 ----------
  function update(dt) {
    time += dt;
    updateBackground(dt);
    if (shake > 0) shake = Math.max(0, shake - dt * 30);

    for (const p of particles) {
      p.vy += 600 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
    }
    if (particles.length > 500) particles.splice(0, particles.length - 500);
    particles = particles.filter(p => p.life > 0);
    for (const p of popups) { p.y -= 40 * dt; p.life -= dt; }
    popups = popups.filter(p => p.life > 0);
    if (banner) { banner.life -= dt; if (banner.life <= 0) banner = null; }

    if (state === 'over') {
      endTimer += dt;
      for (const a of areas) a.t += dt;
      return;
    }
    if (state !== 'play') return;

    const p = params(level, dodged - levelStart(level));

    // プレイヤー
    const move = inputDir();
    const step = p.playerSpeed * dt;
    const ctl = activeInput();
    // なぞり操作は指の位置にピタッと止まる（行き過ぎてプルプルしない）
    if (ctl && ctl.kind === 'drag' && Math.abs(ctl.x - player.x) <= step) player.x = ctl.x;
    else player.x += move * step;
    player.x = Math.max(player.w / 2 + 4, Math.min(W - player.w / 2 - 4, player.x));
    if (move !== 0) { player.face = move; player.step += dt * 14; }

    // ビールをかけてくる人
    for (const b of bosses) {
      b.x += b.dir * p.bossSpeed * dt;
      if (b.x > W - b.r - 10) { b.x = W - b.r - 10; b.dir = -1; }
      if (b.x < b.r + 10) { b.x = b.r + 10; b.dir = 1; }
      if (b.windup > 0) b.windup -= dt;
      if (b.shoutLife > 0) b.shoutLife -= dt;
    }

    if (levelPause > 0) levelPause -= dt;

    // 通常攻撃
    const area = areas[0];
    const calm = area && area.safe;
    throwTimer -= dt;
    if (throwTimer <= 0 && levelPause <= 0 && !calm) {
      if (area) p.fan = 1;
      throwVolley(p);
      throwTimer = p.interval * (bosses.length > 1 ? 0.75 : 1) * (area ? 1.8 : 1) + Math.random() * 0.3;
    }

    // 範囲攻撃（Lv.2 から）
    if (level >= 2 && levelPause <= 0) {
      areaTimer -= dt;
      if (areaTimer <= 0 && areas.length === 0) {
        startArea(p);
        areaTimer = p.areaInterval + Math.random() * 1.5;
      }
    }

    for (const a of areas) {
      a.t += dt;
      if (a.t >= a.warn) {
        if (!a.poured) { a.poured = true; sfx.pour(); shake = Math.max(shake, 4); }
        if (inArea(a)) {
          lastStyle = a.style;
          deathBy = `${drinkOf(a.style).name}の滝に飲まれた…`;
          gameOver();
          return;
        }
        if (Math.random() < 0.6) {
          const [x1, x2] = a.rects[Math.floor(Math.random() * a.rects.length)];
          addSplash(x1 + Math.random() * (x2 - x1), H - 30, 2, false, a.style);
        }
      }
      if (a.t >= a.warn + a.active) {
        a.done = true;
        if (a.safe) throwTimer = Math.max(throwTimer, 0.5);
        sfx.area();
        addDodge(`範囲よけた！ +${AREA_BONUS}`, Math.max(90, Math.min(W - 90, player.x)), player.y - 80, AREA_BONUS, true);
      }
    }
    areas = areas.filter(a => !a.done);

    // ビール
    for (const b of beers) {
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.rot += b.spin * dt;
      if (Math.random() < 0.4) {
        particles.push({ x: b.x, y: b.y, vx: (Math.random() - 0.5) * 30, vy: -20, life: 0.4, max: 0.4, r: 2 + Math.random() * 2, foam: Math.random() < 0.5, d: STYLES[b.style].drink });
      }
      // 人の高さを通過した瞬間に、ビールが左右どちらを通ったか記録
      if (!b.crossed && b.y >= player.y - 4) {
        b.crossed = true;
        const v = volleys.get(b.vid);
        if (v) { if (b.x < player.x) v.left = true; else v.right = true; }
      }
      if (rectHit(b)) {
        lastStyle = b.style;
        deathBy = `${drinkOf(b.style).name}を頭からかぶった…`;
        gameOver();
        return;
      }
      const passed = b.y > player.y + player.h / 2 + 10;
      const out = b.x < -30 || b.x > W + 30;
      if (passed || out) {
        b.gone = true;
        sfx.dodge();
        if (passed) addSplash(b.x, H - 14, 8, false, b.style);
        addDodge('よけた！', player.x, player.y - 50);
        if (state !== 'play') return;
        // 同じ投げのビールが全部通り過ぎたとき、左右両方を通っていたら「すり抜け」
        const v = volleys.get(b.vid);
        if (v && --v.n === 0) {
          volleys.delete(b.vid);
          if (v.left && v.right) {
            sfx.slip();
            addDodge(`すり抜け！ +${SLIP_BONUS}`, Math.max(90, Math.min(W - 90, player.x)), player.y - 95, SLIP_BONUS, true, '#2e9e4f');
            if (state !== 'play') return;
          }
        }
      }
    }
    beers = beers.filter(b => !b.gone);
  }

  function say(boss, text, life, loud = false) {
    boss.shout = text;
    boss.shoutLife = life;
    boss.loud = loud;
  }

  // 体験版の上限レベルをクリアしたとき
  function demoEnd() {
    state = 'over';
    for (const b of bosses) say(b, '続きは製品版で！', 99);
    pauseBtn.classList.remove('show');
    clearInput();
    sfx.levelUp();
    const newBest = dodged > best.score;
    if (newBest) { best = { ...best, score: dodged, level }; saveBest(best); }
    setTimeout(() => {
      $('endTitle').textContent = '体験版はここまで！';
      $('endText').innerHTML =
        `Lv.${CFG.maxLevel} クリア！ よけた数：<b>${dodged}</b> 杯<br>` +
        `製品版は「終電なし」「酒呑童子」…<br>最後の「素戔嗚尊」まで続く。<br>` +
        `<b>好きな人の顔写真</b>にも差し替えられる！` +
        (CFG.buyUrl ? `<br><a class="buy" href="${CFG.buyUrl}" target="_blank" rel="noopener">製品版を見る</a>` : '');
      endScreen.classList.remove('hidden');
    }, 900);
  }

  function gameOver() {
    state = 'over';
    for (const b of bosses) say(b, pick(GAME_OVER_LINES), 99);
    pauseBtn.classList.remove('show');
    clearInput();
    player.hurt = true;
    shake = 14;
    addSplash(player.x, player.y - 20, 90, true, lastStyle);
    sfx.splash();
    const newBest = dodged > best.score;
    if (newBest) { best = { ...best, score: dodged, level }; saveBest(best); }
    setTimeout(() => {
      $('endTitle').textContent = 'ビールまみれ…';
      $('endText').innerHTML =
        (cleared ? '🎉 <b>全制覇達成！</b><br>' : '') +
        `${deathBy}<br>` +
        `よけた数：<b>${dodged}</b> 杯${newBest ? '（自己ベスト！）' : ''}<br>` +
        `到達：<b>Lv.${level} ${levelName(level)}</b><br>` +
        `<span class="small">ベスト：${best.score}杯（Lv.${best.level}）</span>`;
      endScreen.classList.remove('hidden');
    }, 1100);
  }

  // ---------- 描画 ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function outlinedText(text, x, y, size, fill, align = 'center') {
    ctx.font = `bold ${size}px sans-serif`;
    ctx.textAlign = align;
    ctx.lineWidth = 5;
    ctx.strokeStyle = '#fff';
    ctx.strokeText(text, x, y);
    ctx.fillStyle = fill;
    ctx.fillText(text, x, y);
  }

  // 神様エリアの背景（バッカス：ワイン色の夜／オロチ：暗い沼／素戔嗚尊：嵐の夜）
  const BG_THEMES = {
    shuten:  { top: [36, 8, 10], bottom: [76, 20, 16], floor: [62, 34, 26] },
    bacchus: { top: [46, 12, 36], bottom: [88, 26, 58], floor: [70, 36, 52] },
    orochi:  { top: [10, 30, 24], bottom: [34, 56, 42], floor: [52, 52, 34] },
    susanoo: { top: [10, 14, 40], bottom: [32, 36, 74], floor: [40, 40, 64] },
  };
  let bg = null;
  let lightning = 0, nextLightning = 3;
  function bgTarget() {
    const theme = BG_THEMES[styleFor(level)];
    if (theme) return { top: theme.top, bottom: theme.bottom, floor: theme.floor, god: 1 };
    // レベルが上がると店内がだんだん赤く（酔って）くる
    const heat = Math.min(1, (level - 1) / 8);
    return {
      top: [243, 223 - heat * 60, 182 - heat * 90],
      bottom: [230, 196 - heat * 70, 140 - heat * 80],
      floor: [176, 122, 63],
      god: 0,
    };
  }
  function updateBackground(dt) {
    const t = bgTarget();
    if (!bg) bg = { top: [...t.top], bottom: [...t.bottom], floor: [...t.floor], god: t.god };
    const k = 1 - Math.exp(-dt * 2.5);
    for (const key of ['top', 'bottom', 'floor']) {
      for (let i = 0; i < 3; i++) bg[key][i] += (t[key][i] - bg[key][i]) * k;
    }
    bg.god += (t.god - bg.god) * k;
    // 素戔嗚尊のステージは嵐。ときどき稲妻が光る
    if (lightning > 0) lightning = Math.max(0, lightning - dt * 3);
    if (styleFor(level) === 'susanoo' && state === 'play') {
      nextLightning -= dt;
      if (nextLightning <= 0) { lightning = 1; nextLightning = 3 + Math.random() * 4; }
    }
  }
  const rgb = (c, shade = 0) => `rgb(${Math.round(c[0] + shade)}, ${Math.round(c[1] + shade)}, ${Math.round(c[2] + shade)})`;

  function drawBackground() {
    if (!bg) updateBackground(0);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgb(bg.top));
    g.addColorStop(1, rgb(bg.bottom));
    ctx.fillStyle = g;
    ctx.fillRect(-40, -40, W + 80, H + 80);

    // 神様エリアは星がまたたく
    if (bg.god > 0.05) {
      for (let i = 0; i < 40; i++) {
        const sx = (i * 97.3) % W;
        const sy = (i * 53.7) % (H * 0.7);
        ctx.globalAlpha = bg.god * (0.3 + 0.5 * (0.5 + 0.5 * Math.sin(time * 2 + i)));
        ctx.fillStyle = '#fff7e6';
        ctx.fillRect(sx, sy, 2, 2);
      }
      ctx.globalAlpha = 1;
    }
    // 稲妻
    if (lightning > 0) {
      ctx.fillStyle = `rgba(220,230,255,${lightning * 0.35})`;
      ctx.fillRect(-40, -40, W + 80, H + 80);
      if (lightning > 0.6) {
        ctx.strokeStyle = `rgba(255,255,255,${lightning})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        let lx = W * (0.2 + 0.6 * ((nextLightning * 7) % 1)), ly = 0;
        ctx.moveTo(lx, ly);
        while (ly < H * 0.35) {
          ly += 25;
          lx += ((ly * 13) % 30) - 15;
          ctx.lineTo(lx, ly);
        }
        ctx.stroke();
      }
    }

    for (let i = 0; i < 4; i++) {
      const x = 50 + i * 100;
      const sway = Math.sin(time * 1.5 + i) * 3;
      ctx.save();
      ctx.translate(x + sway, 20);
      ctx.fillStyle = '#d9412b';
      ctx.beginPath();
      ctx.ellipse(0, 0, 13, 17, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,220,150,.35)';
      ctx.beginPath();
      ctx.ellipse(-4, -4, 4, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#3a2410';
      ctx.fillRect(-7, -19, 14, 4);
      ctx.fillRect(-7, 15, 14, 4);
      ctx.restore();
    }

    ctx.fillStyle = rgb(bg.floor);
    ctx.fillRect(-40, H - 30, W + 80, 70);
    ctx.fillStyle = rgb(bg.floor, -36);
    for (let x = 0; x < W; x += 50) ctx.fillRect(x, H - 30, 2, 30);
    ctx.fillStyle = rgb(bg.floor, 25);
    ctx.fillRect(-40, H - 30, W + 80, 4);
  }

  // 範囲攻撃：巨大ビール瓶が現れて傾き、ビールを流し込んでくる
  const POUR_ANGLE = 132 * Math.PI / 180;
  const easeOutBack = x => 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2);

  // 巨大ビール瓶（口が (0, -h/2) に来る向きで描き、回転させて注ぐ）
  // 瓶の見た目（ビール瓶とワインボトル）
  const BOTTLE_LOOKS = {
    bottle: { glass: ['#4a2306', '#8a4610', '#a85a17', '#3d1c05'], lip: '#6b350c', band: '#e9b23a', bandStart: 0.45, bandLen: 0.28,
              neckLen: 0.24, shoulder: 0.16, label: '#fff4dc', labelBand: '#d9412b', text: 'BEER', textColor: '#3a2410' },
    winebottle: { glass: ['#0d240f', '#1f4d22', '#2e6b30', '#0a1c0b'], lip: '#5e0b26', band: '#8e1b3a', bandStart: 0, bandLen: 0.7,
              neckLen: 0.3, shoulder: 0.12, label: '#f6efe0', labelBand: '#8e1b3a', text: 'VINO', textColor: '#5e0b26' },
  };

  function drawGiantBottle(px, py, w, h, angle, look = BOTTLE_LOOKS.bottle) {
    const top = -h / 2, bottom = h / 2;
    const neckW = w * 0.38;
    const neckLen = h * look.neckLen;
    const shoulder = h * look.shoulder;
    const bodyTop = top + neckLen + shoulder;
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(angle);

    // 瓶の形
    ctx.beginPath();
    ctx.moveTo(-neckW / 2, top + h * 0.03);
    ctx.lineTo(-neckW / 2, top + neckLen);
    ctx.bezierCurveTo(-neckW / 2, top + neckLen + shoulder * 0.5, -w / 2, top + neckLen + shoulder * 0.4, -w / 2, bodyTop);
    ctx.lineTo(-w / 2, bottom - w * 0.12);
    ctx.quadraticCurveTo(-w / 2, bottom, -w / 2 + w * 0.12, bottom);
    ctx.lineTo(w / 2 - w * 0.12, bottom);
    ctx.quadraticCurveTo(w / 2, bottom, w / 2, bottom - w * 0.12);
    ctx.lineTo(w / 2, bodyTop);
    ctx.bezierCurveTo(w / 2, top + neckLen + shoulder * 0.4, neckW / 2, top + neckLen + shoulder * 0.5, neckW / 2, top + neckLen);
    ctx.lineTo(neckW / 2, top + h * 0.03);
    ctx.closePath();
    const glass = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
    glass.addColorStop(0, look.glass[0]);
    glass.addColorStop(0.35, look.glass[1]);
    glass.addColorStop(0.6, look.glass[2]);
    glass.addColorStop(1, look.glass[3]);
    ctx.fillStyle = glass;
    ctx.fill();
    ctx.strokeStyle = 'rgba(40,18,4,.8)';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // 口のふち
    ctx.fillStyle = look.lip;
    roundRect(-neckW / 2 - 3, top, neckW + 6, h * 0.045, 3);
    ctx.fill();
    // 首の帯
    ctx.fillStyle = look.band;
    ctx.fillRect(-neckW / 2, top + neckLen * look.bandStart, neckW, neckLen * look.bandLen);

    // ラベル
    const ly = bodyTop + (bottom - bodyTop) * 0.18;
    const lh = (bottom - bodyTop) * 0.5;
    ctx.fillStyle = look.label;
    ctx.fillRect(-w / 2, ly, w, lh);
    ctx.fillStyle = look.labelBand;
    ctx.fillRect(-w / 2, ly + lh * 0.1, w, lh * 0.14);
    ctx.fillRect(-w / 2, ly + lh * 0.76, w, lh * 0.14);
    ctx.save();
    ctx.translate(0, ly + lh / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillStyle = look.textColor;
    ctx.font = `bold ${Math.round(w * 0.34)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(look.text, 0, 0);
    ctx.restore();

    // ガラスの光
    ctx.fillStyle = 'rgba(255,255,255,.28)';
    ctx.fillRect(-w / 2 + w * 0.14, bodyTop + 6, w * 0.1, ly - bodyTop - 8);
    ctx.fillRect(-w / 2 + w * 0.14, ly + lh + 4, w * 0.1, bottom - ly - lh - 12);
    ctx.fillRect(-neckW / 2 + neckW * 0.18, top + h * 0.06, neckW * 0.16, neckLen * 0.35);
    ctx.restore();
  }

  // 酒樽（口が上。ヤマタノオロチ）
  function drawGiantTaru(px, py, w, h, angle) {
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(angle);
    const top = -h / 2, bottom = h / 2;
    // 胴（少しふくらんだ木の樽）
    ctx.beginPath();
    ctx.moveTo(-w * 0.44, top);
    ctx.quadraticCurveTo(-w * 0.56, 0, -w * 0.44, bottom);
    ctx.lineTo(w * 0.44, bottom);
    ctx.quadraticCurveTo(w * 0.56, 0, w * 0.44, top);
    ctx.closePath();
    const g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
    g.addColorStop(0, '#9c6a33');
    g.addColorStop(0.4, '#d9a35c');
    g.addColorStop(1, '#8a5a28');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = 'rgba(70,40,15,.8)';
    ctx.lineWidth = 2.5;
    ctx.stroke();
    // 板の継ぎ目
    ctx.strokeStyle = 'rgba(90,55,20,.35)';
    ctx.lineWidth = 1.5;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(i * w * 0.17, top + 2);
      ctx.quadraticCurveTo(i * w * 0.2, 0, i * w * 0.17, bottom - 2);
      ctx.stroke();
    }
    // たが（輪）
    ctx.fillStyle = '#3a2a1a';
    for (const y of [top + h * 0.1, bottom - h * 0.14]) {
      ctx.fillRect(-w * 0.5, y, w, h * 0.06);
    }
    // 口の縁と酒
    ctx.fillStyle = '#c99a5a';
    ctx.beginPath();
    ctx.ellipse(0, top, w * 0.44, h * 0.07, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#d6edf7';
    ctx.beginPath();
    ctx.ellipse(0, top, w * 0.38, h * 0.05, 0, 0, Math.PI * 2);
    ctx.fill();
    // 「酒」の札
    ctx.fillStyle = '#fffaf0';
    ctx.beginPath();
    ctx.arc(0, h * 0.04, w * 0.24, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#c8261b';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.fillStyle = '#1a1a1a';
    ctx.font = `bold ${Math.round(w * 0.3)}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('酒', 0, h * 0.05);
    ctx.textBaseline = 'alphabetic';
    ctx.restore();
  }

  // 大徳利（白い焼き物に藍の模様。素戔嗚尊の八塩折の酒）
  function drawGiantTokkuri(px, py, w, h, angle) {
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(angle);
    const top = -h / 2, bottom = h / 2;
    const neckW = w * 0.3;
    ctx.beginPath();
    ctx.moveTo(-neckW * 0.8, top);
    ctx.quadraticCurveTo(-neckW / 2, top + h * 0.06, -neckW / 2, top + h * 0.2);
    ctx.bezierCurveTo(-neckW / 2, top + h * 0.38, -w / 2, top + h * 0.45, -w / 2, top + h * 0.72);
    ctx.quadraticCurveTo(-w / 2, bottom, -w * 0.3, bottom);
    ctx.lineTo(w * 0.3, bottom);
    ctx.quadraticCurveTo(w / 2, bottom, w / 2, top + h * 0.72);
    ctx.bezierCurveTo(w / 2, top + h * 0.45, neckW / 2, top + h * 0.38, neckW / 2, top + h * 0.2);
    ctx.quadraticCurveTo(neckW / 2, top + h * 0.06, neckW * 0.8, top);
    ctx.closePath();
    const g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
    g.addColorStop(0, '#d8d4c8');
    g.addColorStop(0.4, '#fbf8f0');
    g.addColorStop(1, '#c9c4b6');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = 'rgba(60,60,80,.6)';
    ctx.lineWidth = 2.5;
    ctx.stroke();
    // 藍の模様（波と帯）
    ctx.save();
    ctx.clip();
    ctx.strokeStyle = '#2b4c8c';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-w, top + h * 0.28);
    ctx.lineTo(w, top + h * 0.28);
    ctx.stroke();
    ctx.lineWidth = 2.5;
    for (let row = 0; row < 2; row++) {
      const y = top + h * (0.8 + row * 0.08);
      ctx.beginPath();
      for (let x = -w / 2; x <= w / 2; x += w / 6) {
        ctx.moveTo(x, y);
        ctx.quadraticCurveTo(x + w / 12, y - 6, x + w / 6, y);
      }
      ctx.stroke();
    }
    ctx.restore();
    // 「神酒」の文字
    ctx.fillStyle = '#2b4c8c';
    ctx.font = `bold ${Math.round(w * 0.22)}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('神', 0, top + h * 0.5);
    ctx.fillText('酒', 0, top + h * 0.5 + w * 0.24);
    ctx.textBaseline = 'alphabetic';
    // 口の縁
    ctx.fillStyle = '#e9e5da';
    ctx.beginPath();
    ctx.ellipse(0, top, neckW * 0.8, h * 0.025, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // 大瓢箪（口が上。酒呑童子のにごり酒）
  function drawGiantHyotan(px, py, w, h, angle) {
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(angle);
    const top = -h / 2;
    const r1 = w * 0.32, c1 = top + h * 0.3;
    const r2 = w * 0.5, c2 = top + h * 0.74;
    const g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
    g.addColorStop(0, '#9c5a14');
    g.addColorStop(0.4, '#e3a046');
    g.addColorStop(1, '#8a4c10');
    ctx.fillStyle = g;
    ctx.strokeStyle = 'rgba(70,35,5,.8)';
    ctx.lineWidth = 2.5;
    // 注ぎ口
    ctx.fillRect(-w * 0.09, top, w * 0.18, h * 0.12);
    ctx.strokeRect(-w * 0.09, top, w * 0.18, h * 0.12);
    // 上と下のふくらみ
    ctx.beginPath();
    ctx.arc(0, c1, r1, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, c2, r2, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillRect(-r1 * 0.6, c1, r1 * 1.2, c2 - c1);
    // 腰の赤い紐とふさ
    ctx.fillStyle = '#c8261b';
    ctx.fillRect(-r1 * 0.75, top + h * 0.5 - 4, r1 * 1.5, 8);
    ctx.strokeStyle = '#c8261b';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(r1 * 0.6, top + h * 0.5);
    ctx.quadraticCurveTo(r1 * 1.4, top + h * 0.56, r1 * 1.1, top + h * 0.66);
    ctx.stroke();
    // 「鬼」の文字
    ctx.fillStyle = '#1a1a1a';
    ctx.font = `bold ${Math.round(w * 0.38)}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('鬼', 0, c2 + 2);
    ctx.textBaseline = 'alphabetic';
    // 光
    ctx.fillStyle = 'rgba(255,255,255,.3)';
    ctx.beginPath();
    ctx.ellipse(-r2 * 0.45, c2 - r2 * 0.3, r2 * 0.14, r2 * 0.35, 0.3, 0, Math.PI * 2);
    ctx.fill();
    // 口
    ctx.fillStyle = '#4a2a08';
    ctx.beginPath();
    ctx.ellipse(0, top, w * 0.09, h * 0.015, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // 範囲攻撃の容器ごとの大きさ（w: 幅, h: 高さ, mouth: 注ぎ口の幅）
  function pourerSize(pourer, rw) {
    if (pourer === 'hyotan') { const w = Math.max(54, Math.min(78, rw * 0.42)); return { w, h: w * 1.9, mouth: w * 0.2 }; }
    if (pourer === 'taru') { const w = Math.max(64, Math.min(96, rw * 0.5)); return { w, h: w * 1.15, mouth: w * 0.7 }; }
    if (pourer === 'tokkuri') { const w = Math.max(46, Math.min(68, rw * 0.38)); return { w, h: w * 2.3, mouth: w * 0.36 }; }
    if (pourer === 'winebottle') { const w = Math.max(36, Math.min(54, rw * 0.3)); return { w, h: w * 3.1, mouth: w * 0.4 }; }
    const w = Math.max(38, Math.min(58, rw * 0.32));
    return { w, h: w * 2.8, mouth: w * 0.42 };
  }

  function drawPourer(pourer, px, py, w, h, angle) {
    if (pourer === 'taru') drawGiantTaru(px, py, w, h, angle);
    else if (pourer === 'tokkuri') drawGiantTokkuri(px, py, w, h, angle);
    else if (pourer === 'hyotan') drawGiantHyotan(px, py, w, h, angle);
    else drawGiantBottle(px, py, w, h, angle, BOTTLE_LOOKS[pourer]);
  }

  function drawAreas() {
    const top = AREA_TOP;
    const floor = H - 30;
    for (const a of areas) {
      const warning = a.t < a.warn;

      // 予告：落ちてくる場所を赤く点滅させる
      if (warning) {
        const blink = 0.12 + 0.12 * (0.5 + 0.5 * Math.sin(a.t * 30));
        for (const [x1, x2] of a.rects) {
          ctx.fillStyle = `rgba(217,65,43,${blink})`;
          ctx.fillRect(x1, top, x2 - x1, floor - top);
          ctx.save();
          ctx.beginPath();
          ctx.rect(x1, top, x2 - x1, floor - top);
          ctx.clip();
          ctx.strokeStyle = 'rgba(217,65,43,.22)';
          ctx.lineWidth = 8;
          const off = (a.t * 80) % 32;
          for (let s = -H; s < W + H; s += 32) {
            ctx.beginPath();
            ctx.moveTo(s + off, top);
            ctx.lineTo(s + off - (H - top), H);
            ctx.stroke();
          }
          ctx.restore();
          if (x2 - x1 > 40) outlinedText('⚠', (x1 + x2) / 2, floor - 40, 26, '#d9412b');
        }
        if (a.safe) {
          const [g1, g2] = a.safe;
          ctx.fillStyle = 'rgba(80,190,90,.28)';
          ctx.fillRect(g1, top, g2 - g1, floor - top);
          outlinedText('ここ！', (g1 + g2) / 2, H - 120, 18, '#2e8b3e');
        }
      }

      const pourer = STYLES[a.style || 'beer'].pourer;
      const drink = drinkOf(a.style);
      for (const [x1, x2] of a.rects) {
        const rw = x2 - x1;
        const cx = (x1 + x2) / 2;
        // 画面の内側に体が来るように傾ける向きを決める
        const dir = cx < W / 2 ? -1 : 1;
        const { w, h, mouth } = pourerSize(pourer, rw);
        const py = top + 4;
        const px = cx - (h / 2) * Math.sin(dir * POUR_ANGLE);

        // 瓶の動き：上から登場 → 揺れながら少し傾く → 一気に傾けて注ぐ
        let angle, enterY = 0;
        if (warning) {
          const e = Math.min(1, a.t / 0.28);
          enterY = (1 - easeOutBack(e)) * -(py + h);
          const tiltStart = a.warn - 0.14;
          if (a.t < tiltStart) {
            const ready = a.t / tiltStart;
            angle = dir * (ready * 0.42 + Math.sin(a.t * 22) * 0.06 * ready);
          } else {
            const q = (a.t - tiltStart) / 0.14;
            angle = dir * (0.42 + (POUR_ANGLE - 0.42) * q * q);
          }
        } else {
          angle = dir * (POUR_ANGLE + Math.sin(time * 14) * 0.04);
        }
        const mx = px + (h / 2) * Math.sin(angle);
        const my = py + enterY - (h / 2) * Math.cos(angle);

        if (warning) {
          // 傾きはじめると口から泡がこぼれる
          if (Math.abs(angle) > 0.2) {
            ctx.fillStyle = drink.drip;
            for (let i = 0; i < 3; i++) {
              const d = (a.t * 260 + i * 37) % 110;
              ctx.beginPath();
              ctx.arc(mx + Math.sin(i * 2.1) * 6, my + d, 3 + i, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        } else {
          // 発動：口から流れ出たビールが、落ちる範囲いっぱいに広がる
          const k = Math.min(1, (a.t - a.warn) / 0.12);
          const spreadY = Math.min(floor, my + 80);
          const bottom = my + (floor - my) * k;
          const tw = mouth;
          const g = ctx.createLinearGradient(0, my, 0, floor);
          g.addColorStop(0, drink.top);
          g.addColorStop(1, drink.bottom);
          ctx.fillStyle = g;
          ctx.globalAlpha = 0.95;
          ctx.beginPath();
          ctx.moveTo(mx - tw / 2, my);
          ctx.lineTo(mx + tw / 2, my);
          if (bottom > spreadY) {
            ctx.quadraticCurveTo(mx + tw / 2, spreadY - 30, x2, spreadY);
            ctx.lineTo(x2, bottom);
            ctx.lineTo(x1, bottom);
            ctx.lineTo(x1, spreadY);
            ctx.quadraticCurveTo(mx - tw / 2, spreadY - 30, mx - tw / 2, my);
          } else {
            const t2 = (bottom - my) / (spreadY - my);
            ctx.lineTo(mx + tw / 2 + (x2 - mx - tw / 2) * t2, bottom);
            ctx.lineTo(mx - tw / 2 + (x1 - mx + tw / 2) * t2, bottom);
          }
          ctx.closePath();
          ctx.fill();
          ctx.globalAlpha = 1;
          ctx.strokeStyle = drink.edge;
          ctx.lineWidth = 2;
          ctx.stroke();
          // 流れのすじ
          ctx.save();
          ctx.clip();
          ctx.fillStyle = drink.streak;
          for (let sx = x1 + 6; sx < x2 - 4; sx += 13) {
            const off = ((a.t * 900) + sx * 7) % 80;
            for (let sy = my - 80 + off; sy < bottom; sy += 80) ctx.fillRect(sx, sy, 3, 30);
          }
          ctx.restore();
          // 床ではねる泡
          if (k >= 1) {
            ctx.fillStyle = drink.foam;
            for (let fx = x1; fx < x2; fx += 16) {
              ctx.beginPath();
              ctx.arc(fx + 8, floor - 2, 9 + Math.sin(time * 20 + fx) * 3, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }
        drawPourer(pourer, px, py + enterY, w, h, angle);
        if (!warning) {
          // 注ぎ口でゴボゴボ泡立つ（ワインや日本酒はしぶき）
          ctx.fillStyle = drink === DRINKS.beer ? '#fffaf0' : drink.drip;
          for (let i = 0; i < 4; i++) {
            const r = w * 0.14 + Math.sin(time * 25 + i * 1.7) * w * 0.05;
            ctx.beginPath();
            ctx.arc(mx + Math.cos(i * 1.6 + time * 8) * w * 0.18, my + 6 + i * 5, r, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      if (warning) {
        // 残り時間バー
        ctx.fillStyle = '#d9412b';
        ctx.fillRect(0, top - 6, W * (1 - a.t / a.warn), 4);
      }
    }
  }

  // 酒呑童子から先は、写真の枠をステージにちなんだ飾りにする
  const FRAME_COLORS = { shuten: '#b3201a', bacchus: '#e8b33a', orochi: '#2f6b3a', susanoo: '#e8b33a' };

  function drawFrameDeco(style, x, y, r) {
    if (style === 'shuten') {
      // 鬼の角が2本
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = '#4a2a10';
      for (const a of [-2.2, -0.94]) {
        ctx.save();
        ctx.translate(x + Math.cos(a) * (r - 2), y + Math.sin(a) * (r - 2));
        ctx.rotate(a + Math.PI / 2);
        const lean = a < -1.57 ? -1 : 1;
        ctx.beginPath();
        ctx.moveTo(-8, 4);
        ctx.quadraticCurveTo(-6, -14, lean * 4, -26);
        ctx.quadraticCurveTo(6, -12, 8, 4);
        ctx.closePath();
        const g = ctx.createLinearGradient(0, 4, 0, -26);
        g.addColorStop(0, '#f6ead0');
        g.addColorStop(1, '#d8b878');
        ctx.fillStyle = g;
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }
      // 外側の黒い輪
      ctx.strokeStyle = '#1a0606';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, r + 3, 0, Math.PI * 2);
      ctx.stroke();
    } else if (style === 'bacchus') {
      // ぶどうのつると房
      for (let i = 0; i < 16; i++) {
        const a = i / 16 * Math.PI * 2;
        ctx.save();
        ctx.translate(x + Math.cos(a) * (r + 3), y + Math.sin(a) * (r + 3));
        ctx.rotate(a + Math.PI / 2 + (i % 2 ? 0.5 : -0.5));
        ctx.fillStyle = i % 2 ? '#4f8a2b' : '#6aa83a';
        ctx.beginPath();
        ctx.ellipse(0, 0, 7, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      for (const a of [0.75, 2.4, -1.57]) {
        const gx = x + Math.cos(a) * (r + 8), gy = y + Math.sin(a) * (r + 8);
        ctx.fillStyle = '#6b2a7a';
        for (const [dx, dy] of [[-5, -4], [0, -4], [5, -4], [-2.5, 0], [2.5, 0], [0, 4]]) {
          ctx.beginPath();
          ctx.arc(gx + dx, gy + dy, 3.6, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = 'rgba(255,255,255,.35)';
        ctx.beginPath();
        ctx.arc(gx - 1, gy - 5, 1.3, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (style === 'orochi') {
      // うろこの太い輪と、外を向いた8つの蛇の頭
      ctx.strokeStyle = '#2f6b3a';
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.arc(x, y, r + 3, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(160,220,140,.6)';
      ctx.lineWidth = 1.2;
      for (let i = 0; i < 28; i++) {
        const a = i / 28 * Math.PI * 2;
        ctx.beginPath();
        ctx.arc(x + Math.cos(a) * (r + 3), y + Math.sin(a) * (r + 3), 3, a - 1.2, a + 1.2);
        ctx.stroke();
      }
      for (let i = 0; i < 8; i++) {
        const a = i / 8 * Math.PI * 2 - Math.PI / 2 + Math.sin(time * 3 + i) * 0.06;
        ctx.save();
        ctx.translate(x + Math.cos(a) * (r + 12), y + Math.sin(a) * (r + 12));
        ctx.rotate(a);
        // 舌
        ctx.strokeStyle = '#d9412b';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(6, 0); ctx.lineTo(11, 0); ctx.lineTo(13, -2); ctx.moveTo(11, 0); ctx.lineTo(13, 2);
        ctx.stroke();
        // 頭
        ctx.fillStyle = '#3f7f3a';
        ctx.beginPath();
        ctx.ellipse(0, 0, 7, 5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffd34d';
        ctx.beginPath();
        ctx.arc(2, -2.5, 1.6, 0, Math.PI * 2);
        ctx.arc(2, 2.5, 1.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    } else if (style === 'susanoo') {
      // 金の二重の輪、稲妻、雲
      ctx.strokeStyle = '#e8b33a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, r + 5, 0, Math.PI * 2);
      ctx.stroke();
      const flick = 0.7 + 0.3 * Math.abs(Math.sin(time * 9));
      for (const a of [-2.4, -0.75, -1.57]) {
        ctx.save();
        ctx.translate(x + Math.cos(a) * (r + 4), y + Math.sin(a) * (r + 4));
        ctx.rotate(a);
        ctx.globalAlpha = flick;
        ctx.beginPath();
        ctx.moveTo(0, -3); ctx.lineTo(10, -5); ctx.lineTo(8, 0); ctx.lineTo(20, -2);
        ctx.lineTo(9, 4); ctx.lineTo(11, 0); ctx.lineTo(0, 3);
        ctx.closePath();
        ctx.fillStyle = '#ffe066';
        ctx.fill();
        ctx.strokeStyle = '#a06e14';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(235,240,255,.95)';
      for (const side of [-1, 1]) {
        const cx = x + side * (r + 2), cy = y + r * 0.55;
        for (const [dx, dy, rr] of [[0, 0, 9], [side * 9, 4, 7], [-side * 7, 6, 6], [side * 3, 8, 6]]) {
          ctx.beginPath();
          ctx.arc(cx + dx, cy + dy, rr, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
  }

  function drawBoss(boss) {
    const wob = Math.sin(time * 6 + boss.x * 0.01) * 3;
    const wind = boss.windup > 0 ? Math.sin(boss.windup * 60) * 4 : 0;
    const x = boss.x + wind, y = boss.y + wob;

    ctx.fillStyle = '#1d1d1f';
    ctx.beginPath();
    ctx.ellipse(x, y + boss.r + 8, boss.r * 0.95, 20, 0, Math.PI, 0);
    ctx.fill();

    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, boss.r, 0, Math.PI * 2);
    ctx.closePath();
    ctx.fillStyle = '#e0b48a';
    ctx.fill();
    ctx.clip();
    if (faceImg.complete && faceImg.naturalWidth) {
      ctx.drawImage(faceImg, x - boss.r, y - boss.r, boss.r * 2, boss.r * 2);
    }
    ctx.restore();
    const style = state === 'title' ? 'beer' : styleFor(level);
    ctx.lineWidth = 4;
    ctx.strokeStyle = FRAME_COLORS[style] || '#f2a516';
    ctx.beginPath();
    ctx.arc(x, y, boss.r, 0, Math.PI * 2);
    ctx.stroke();
    drawFrameDeco(style, x, y, boss.r);

    if (boss.shoutLife > 0 && state === 'play') {
      // 画面の内側に向けて表示し、長いセリフは文字を小さくして収める
      const right = boss.x > W / 2;
      const tx = right ? x - boss.r - 6 : x + boss.r + 6;
      const room = right ? tx - 4 : W - tx - 4;
      const base = boss.loud ? 22 : 18;
      ctx.font = `bold ${base}px sans-serif`;
      const size = Math.max(11, Math.min(base, base * room / ctx.measureText(boss.shout).width));
      outlinedText(boss.shout, tx, y - 10, size, boss.loud ? '#b8231a' : '#d9412b', right ? 'right' : 'left');
    }
    if (state === 'over') {
      ctx.font = 'bold 22px sans-serif';
      const size = Math.min(22, 22 * (W - 16) / ctx.measureText(boss.shout).width);
      const cx = Math.max(ctx.measureText(boss.shout).width * size / 44 + 8, Math.min(W - ctx.measureText(boss.shout).width * size / 44 - 8, x));
      outlinedText(boss.shout, cx, y + boss.r + 26, size, '#d9412b');
    }
  }

  function drawBeer(b) {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.rot);
    const cup = STYLES[b.style || 'beer'].cup;
    if (cup === 'wineglass') drawWineGlass();
    else if (cup === 'masu') drawMasu();
    else if (cup === 'sakazuki') drawSakazuki();
    else if (cup === 'choko') drawChoko();
    else drawMug();
    ctx.restore();
  }

  // ビールジョッキ
  function drawMug() {
    ctx.strokeStyle = 'rgba(255,255,255,.85)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(13, 2, 7, -Math.PI / 2, Math.PI / 2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    roundRect(-13, -17, 26, 34, 4);
    ctx.fill();
    const g = ctx.createLinearGradient(0, -8, 0, 16);
    g.addColorStop(0, '#f7b733');
    g.addColorStop(1, '#d9820b');
    ctx.fillStyle = g;
    roundRect(-11, -8, 22, 23, 3);
    ctx.fill();
    ctx.fillStyle = '#fffaf0';
    ctx.beginPath();
    ctx.arc(-7, -10, 6, 0, Math.PI * 2);
    ctx.arc(0, -12, 7, 0, Math.PI * 2);
    ctx.arc(7, -10, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(-12, -10, 24, 4);
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.fillRect(-8, -4, 3, 16);
  }

  // ワイングラス（赤ワイン）
  function drawWineGlass() {
    // 脚と台
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.fillRect(-1.5, 3, 3, 11);
    ctx.beginPath();
    ctx.ellipse(0, 15, 10, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    // ボウル
    ctx.beginPath();
    ctx.moveTo(-12, -17);
    ctx.lineTo(12, -17);
    ctx.bezierCurveTo(13, -4, 8, 4, 0, 4);
    ctx.bezierCurveTo(-8, 4, -13, -4, -12, -17);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // ワイン
    ctx.save();
    ctx.clip();
    const g = ctx.createLinearGradient(0, -8, 0, 4);
    g.addColorStop(0, '#b3264f');
    g.addColorStop(1, '#5e0b26');
    ctx.fillStyle = g;
    ctx.fillRect(-14, -8, 28, 14);
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.fillRect(-8, -14, 2.5, 10);
  }

  // 升（木の四角い器に日本酒）
  function drawMasu() {
    // 上の面（酒が見える）
    ctx.fillStyle = '#f3d9a4';
    ctx.beginPath();
    ctx.moveTo(-14, -8); ctx.lineTo(14, -8); ctx.lineTo(10, -16); ctx.lineTo(-10, -16);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#d6edf7';
    ctx.beginPath();
    ctx.moveTo(-11, -9.5); ctx.lineTo(11, -9.5); ctx.lineTo(8, -14.5); ctx.lineTo(-8, -14.5);
    ctx.closePath();
    ctx.fill();
    // 前の面
    const g = ctx.createLinearGradient(-14, 0, 14, 0);
    g.addColorStop(0, '#d9ad6b');
    g.addColorStop(1, '#c3914f');
    ctx.fillStyle = g;
    ctx.fillRect(-14, -8, 28, 24);
    // 木目
    ctx.strokeStyle = 'rgba(120,80,40,.35)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(-14, -2 + i * 7);
      ctx.quadraticCurveTo(0, 1 + i * 7, 14, -2 + i * 7);
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(90,55,20,.7)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(-14, -8, 28, 24);
    // 焼き印の「酒」
    ctx.fillStyle = 'rgba(90,40,10,.8)';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('酒', 0, 5);
    ctx.textBaseline = 'alphabetic';
  }

  // お猪口（にごり酒）
  function drawChoko() {
    ctx.beginPath();
    ctx.moveTo(-12, -9);
    ctx.lineTo(12, -9);
    ctx.quadraticCurveTo(12, 8, 6, 13);
    ctx.lineTo(-6, 13);
    ctx.quadraticCurveTo(-12, 8, -12, -9);
    ctx.closePath();
    const g = ctx.createLinearGradient(-12, 0, 12, 0);
    g.addColorStop(0, '#d9d5ca');
    g.addColorStop(0.45, '#fffdf6');
    g.addColorStop(1, '#cbc6b8');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = 'rgba(60,60,80,.5)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.fillStyle = '#2b4c8c';
    ctx.fillRect(-11.5, -4, 23, 2.5);
    ctx.fillRect(-9, 8, 18, 2);
    ctx.fillStyle = '#c8261b';
    ctx.font = 'bold 9px serif';
    ctx.textAlign = 'center';
    ctx.fillText('鬼', 0, 6);
    // 口とにごり酒
    ctx.fillStyle = '#fffdf6';
    ctx.beginPath();
    ctx.ellipse(0, -9, 12, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ece5d3';
    ctx.beginPath();
    ctx.ellipse(0, -8.5, 10, 3, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // 朱塗りの盃
  function drawSakazuki() {
    // 外側（朱色）
    ctx.fillStyle = '#c8261b';
    ctx.beginPath();
    ctx.ellipse(0, -4, 17, 7, 0, 0, Math.PI);
    ctx.bezierCurveTo(-12, 10, 12, 10, 17, -4);
    ctx.fill();
    // 高台（足）
    ctx.fillStyle = '#9e1b12';
    ctx.fillRect(-6, 7, 12, 5);
    ctx.beginPath();
    ctx.ellipse(0, 12, 7, 2.5, 0, 0, Math.PI * 2);
    ctx.fill();
    // ふち（金）と酒
    ctx.fillStyle = '#e8b33a';
    ctx.beginPath();
    ctx.ellipse(0, -4, 17, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#c8261b';
    ctx.beginPath();
    ctx.ellipse(0, -4, 15, 5.8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#e3f3fa';
    ctx.beginPath();
    ctx.ellipse(0, -3.5, 12.5, 4.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    ctx.beginPath();
    ctx.ellipse(-4, -5, 4, 1.4, 0, 0, Math.PI * 2);
    ctx.fill();
    // 金の「寿」
    ctx.fillStyle = '#e8b33a';
    ctx.font = 'bold 8px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('寿', 0, 7);
  }

  function drawPlayer() {
    const p = player;
    const leg = Math.sin(p.step) * 6;

    ctx.save();
    ctx.translate(p.x, p.y);

    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath();
    ctx.ellipse(0, 30, 18, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#2d3a5a';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-6, 12); ctx.lineTo(-6 + leg, 27);
    ctx.moveTo(6, 12); ctx.lineTo(6 - leg, 27);
    ctx.stroke();

    ctx.fillStyle = p.hurt ? '#e0a33a' : '#3a8ee6';
    roundRect(-14, -12, 28, 28, 8);
    ctx.fill();

    ctx.strokeStyle = '#ffd7b0';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(-13, -4); ctx.lineTo(-19, 10 - leg / 2);
    ctx.moveTo(13, -4); ctx.lineTo(19, 10 + leg / 2);
    ctx.stroke();

    ctx.fillStyle = '#ffd7b0';
    ctx.beginPath();
    ctx.arc(0, -26, 15, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#3a2410';
    ctx.beginPath();
    ctx.arc(0, -30, 15, Math.PI * 1.05, Math.PI * 1.95);
    ctx.fill();

    ctx.fillStyle = '#3a2410';
    const fx = p.face * 3;
    if (p.hurt) {
      ctx.font = 'bold 10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('×  ×', fx, -23);
      ctx.beginPath();
      ctx.arc(fx, -17, 3, 0, Math.PI);
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(fx - 5, -25, 2, 0, Math.PI * 2);
      ctx.arc(fx + 5, -25, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#3a2410';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(fx - 3, -18); ctx.lineTo(fx + 3, -18);
      ctx.stroke();
      // 高レベルでは冷や汗
      if (level >= 5) {
        ctx.fillStyle = '#7cc4ff';
        ctx.beginPath();
        ctx.ellipse(12, -30 + (time * 30 % 10), 2.5, 4, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    if (p.hurt) {
      ctx.fillStyle = 'rgba(255,250,235,.95)';
      ctx.beginPath();
      ctx.arc(-8, -40, 8, 0, Math.PI * 2);
      ctx.arc(3, -43, 9, 0, Math.PI * 2);
      ctx.arc(12, -38, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = `rgba(${drinkOf(lastStyle).rgb},.55)`;
      for (let i = 0; i < 4; i++) {
        const dy = ((endTimer * 40 + i * 13) % 40);
        ctx.fillRect(-12 + i * 8, -14 + dy, 3, 6);
      }
    }
    ctx.restore();
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.max * 1.5));
      const d = DRINKS[p.d || 'beer'];
      ctx.fillStyle = p.color || (p.foam ? d.foam : d.liquid);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawHUD() {
    // レベル表示
    const lv = cleared ? `👑 全制覇 ∞` : `Lv.${level} ${levelName(level)}`;
    ctx.font = 'bold 15px sans-serif';
    const lw = ctx.measureText(lv).width;
    ctx.fillStyle = cleared ? 'rgba(160,110,20,.95)' : level >= 9 ? 'rgba(217,65,43,.9)' : 'rgba(58,36,16,.85)';
    roundRect(10, HUD_Y, lw + 20, 28, 14);
    ctx.fill();
    ctx.fillStyle = '#fff7e6';
    ctx.textAlign = 'left';
    ctx.fillText(lv, 20, HUD_Y + 20);

    // よけた数
    const label = `よけた ${dodged}`;
    ctx.font = 'bold 16px sans-serif';
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = 'rgba(58,36,16,.85)';
    roundRect(W - tw - 34, HUD_Y, tw + 24, 28, 14);
    ctx.fill();
    ctx.fillStyle = '#fff7e6';
    ctx.fillText(label, W - tw - 22, HUD_Y + 20);

    // 次のレベルまでのゲージ（10杯まではジョッキ、それより多いときは棒）
    const size = levelSize(level);
    const inLevel = dodged - levelStart(level);
    const gy = HUD_Y + 34;
    const empty = bg && bg.god > 0.5 ? 'rgba(255,247,230,.25)' : 'rgba(58,36,16,.22)';
    if (cleared) {
      outlinedText('宴は続く…', 60, gy + 11, 13, '#a06e14');
    } else if (size <= 10) {
      for (let i = 0; i < size; i++) {
        ctx.fillStyle = i < inLevel ? '#f2a516' : empty;
        roundRect(12 + i * 13, gy, 9, 12, 2);
        ctx.fill();
      }
    } else {
      ctx.fillStyle = empty;
      roundRect(12, gy + 2, 126, 9, 4.5);
      ctx.fill();
      ctx.fillStyle = '#f2a516';
      roundRect(12, gy + 2, Math.max(9, 126 * Math.min(1, inLevel / size)), 9, 4.5);
      ctx.fill();
      ctx.font = 'bold 11px sans-serif';
      ctx.fillStyle = bg && bg.god > 0.5 ? '#fff7e6' : '#3a2410';
      ctx.textAlign = 'left';
      ctx.fillText(`${inLevel}/${size}`, 144, gy + 11);
    }

    for (const p of popups) {
      ctx.globalAlpha = Math.min(1, p.life * 2);
      outlinedText(p.text, p.x, p.y, p.size || 16, p.color || '#3a8ee6');
    }
    ctx.globalAlpha = 1;

    if (banner) {
      // 小さなバッジで一瞬だけ表示（盤面のじゃまをしない）
      const a = Math.min(1, banner.life / 0.25);
      const pop = 1 + Math.max(0, banner.life - (banner.max - 0.15)) * 2;
      ctx.globalAlpha = a;
      ctx.save();
      ctx.translate(W / 2, HUD_Y + 62);
      ctx.scale(pop, pop);
      ctx.font = 'bold 14px sans-serif';
      const bw = ctx.measureText(banner.text).width + 22;
      ctx.fillStyle = level >= 9 ? 'rgba(217,65,43,.9)' : 'rgba(43,26,14,.82)';
      roundRect(-bw / 2, -13, bw, 26, 13);
      ctx.fill();
      ctx.fillStyle = level >= 9 ? '#fff7e6' : '#f2a516';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(banner.text, 0, 1);
      ctx.restore();
      ctx.textBaseline = 'alphabetic';
      ctx.globalAlpha = 1;
    }
  }

  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    // 高レベルは酔っぱらって画面がゆらゆら
    const sway = state === 'play' ? params(level, 0).sway : 0;
    if (sway) {
      ctx.translate(W / 2, H / 2);
      ctx.rotate(Math.sin(time * 1.3) * sway);
      ctx.translate(-W / 2, -H / 2);
    }
    drawBackground();
    drawAreas();
    for (const b of bosses) drawBoss(b);
    for (const b of beers) drawBeer(b);
    drawPlayer();
    drawParticles();
    if (state !== 'title') drawHUD();
