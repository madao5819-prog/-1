    if (state === 'over' && endTimer < 0.5) {
      ctx.fillStyle = `rgba(${drinkOf(lastStyle).rgb},${0.5 * (1 - endTimer / 0.5)})`;
      ctx.fillRect(-40, -40, W + 80, H + 80);
    }
    ctx.restore();
  }

  // ---------- 体験版のお知らせ ----------
  if (CFG.maxLevel) {
    const note = document.createElement('p');
    note.className = 'small';
    note.innerHTML = `体験版：Lv.${CFG.maxLevel} まで遊べます<br>製品版は全レベル＋好きな人の顔に差し替え`;
    startScreen.insertBefore(note, $('startBtn'));
  }

  // ---------- 顔写真の差し替え（製品版） ----------
  // 写真はスマホの中だけで使い、どこにも送らない
  if (CFG.faceSwap) setupFaceSwap();

  function setupFaceSwap() {
    const tools = document.createElement('div');
    tools.className = 'faceTools';
    tools.innerHTML =
      '<button class="sub" id="pickFaceBtn">📷 顔写真をえらぶ</button>' +
      '<button class="sub" id="resetFaceBtn">元の顔にもどす</button>' +
      '<input type="file" id="faceFile" accept="image/*" hidden>';
    startScreen.insertBefore(tools, $('startBtn'));

    const crop = document.createElement('div');
    crop.className = 'overlay hidden';
    crop.id = 'cropScreen';
    crop.innerHTML =
      '<h1 style="font-size:28px">顔の位置を合わせよう</h1>' +
      '<p class="small">ドラッグで移動、スライダーで拡大</p>' +
      '<canvas id="cropCanvas" width="520" height="520" style="width:260px;height:260px"></canvas>' +
      '<input type="range" id="cropZoom" min="1" max="4" step="0.01" value="1">' +
      '<button id="cropOk">この顔にする</button>' +
      '<button class="sub" id="cropCancel">やめる</button>';
    document.body.appendChild(crop);

    const file = $('faceFile');
    const resetBtn = $('resetFaceBtn');
    const cv = $('cropCanvas');
    const cx2 = cv.getContext('2d');
    const zoom = $('cropZoom');
    const SIZE = 520;
    let img = null, ox = 0, oy = 0, drag = null;

    const refreshReset = () => { resetBtn.style.display = customFace ? '' : 'none'; };
    refreshReset();

    function layout() {
      const base = Math.max(SIZE / img.naturalWidth, SIZE / img.naturalHeight);
      const sc = base * parseFloat(zoom.value);
      const dw = img.naturalWidth * sc, dh = img.naturalHeight * sc;
      // 円の中に必ず写真がかかるように移動量を制限
      ox = Math.max(-(dw - SIZE) / 2, Math.min((dw - SIZE) / 2, ox));
      oy = Math.max(-(dh - SIZE) / 2, Math.min((dh - SIZE) / 2, oy));
      return { x: SIZE / 2 - dw / 2 + ox, y: SIZE / 2 - dh / 2 + oy, dw, dh };
    }
    function drawCrop() {
      const l = layout();
      cx2.clearRect(0, 0, SIZE, SIZE);
      cx2.drawImage(img, l.x, l.y, l.dw, l.dh);
    }

    $('pickFaceBtn').addEventListener('click', () => file.click());
    file.addEventListener('change', () => {
      const f = file.files && file.files[0];
      file.value = '';
      if (!f) return;
      const url = URL.createObjectURL(f);
      const im = new Image();
      im.onload = () => {
        img = im; ox = 0; oy = 0; zoom.value = 1;
        drawCrop();
        crop.classList.remove('hidden');
      };
      im.onerror = () => { URL.revokeObjectURL(url); alert('この画像は読み込めませんでした'); };
      im.src = url;
    });

    zoom.addEventListener('input', () => img && drawCrop());
    cv.addEventListener('pointerdown', e => {
      drag = { x: e.clientX, y: e.clientY, ox, oy };
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    });
    cv.addEventListener('pointermove', e => {
      if (!drag || !img) return;
      const k = SIZE / cv.getBoundingClientRect().width;
      ox = drag.ox + (e.clientX - drag.x) * k;
      oy = drag.oy + (e.clientY - drag.y) * k;
      drawCrop();
    });
    const endDrag = () => { drag = null; };
    cv.addEventListener('pointerup', endDrag);
    cv.addEventListener('pointercancel', endDrag);
    cv.addEventListener('wheel', e => {
      e.preventDefault();
      zoom.value = Math.max(1, Math.min(4, parseFloat(zoom.value) - e.deltaY * 0.002));
      if (img) drawCrop();
    }, { passive: false });

    function closeCrop() {
      crop.classList.add('hidden');
      if (img) URL.revokeObjectURL(img.src);
      img = null;
    }
    $('cropCancel').addEventListener('click', closeCrop);
    $('cropOk').addEventListener('click', () => {
      if (!img) return;
      const out = document.createElement('canvas');
      out.width = out.height = 320;
      const l = layout();
      const k = 320 / SIZE;
      out.getContext('2d').drawImage(img, l.x * k, l.y * k, l.dw * k, l.dh * k);
      const data = out.toDataURL('image/jpeg', 0.85);
      customFace = data;
      try { localStorage.setItem(storeKey('face'), data); } catch (_) {}
      setFace(data);
      refreshReset();
      closeCrop();
    });
    resetBtn.addEventListener('click', () => {
      customFace = null;
      try { localStorage.removeItem(storeKey('face')); } catch (_) {}
      setFace(CFG.face);
      refreshReset();
    });
  }

  // ---------- ループ ----------
  reset();
  resize();
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    if (!paused) update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // オフラインでも遊べるように、ファイルをスマホに保存しておく
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    const register = () => navigator.serviceWorker.register('sw.js').catch(() => {});
    if (document.readyState === 'complete') register();
    else window.addEventListener('load', register);
  }
})();
</script>
</body>
</html>
